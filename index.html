<style>

/* ---------- CARDS ---------- */

.reloj .num{font-family:'Barlow Condensed';font-size:34px;font-weight:700;color:var(--oro);line-height:1;font-variant-numeric:tabular-nums}

.pick.sel:nth-child(1){background:var(--mx)}
.pick.sel:nth-child(2){background:var(--oro);color:#201804}

.avatares{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.tliga{width:100%;border-collapse:collapse;font-size:14px}

Quinielas El Piji Achotero

1. QUÉ ES ESTO
Quinielas El Piji Achotero es un grupo privado de pronósticos deportivos entre conocidos. Cada jornada consta de 10 partidos de la Liga MX y de las ligas europeas, seleccionados por la organización.

5. CÓMO SE GANA
Gana quien acumule más resultados acertados de los 10 partidos. Cada acierto vale un punto. Si dos o más participantes empatan en aciertos, comparten el lugar y el premio correspondiente se divide en partes iguales entre ellos.

6. RESULTADOS
Se toma el resultado al término del tiempo reglamentario, incluido el tiempo añadido. No se consideran tiempos extra ni penales. Si un partido se pospone o se suspende, la organización puede anularlo para todos los participantes o sustituirlo, informando por el grupo antes del cierre.

7. PREMIOS
La bolsa se forma con las boletas pagadas de la jornada y se reparte según los porcentajes publicados al abrirla. Los premios se abonan al monedero del ganador al finalizar la jornada.

8. RETIROS
Puedes solicitar el retiro de tu saldo en cualquier momento. La organización lo paga por el mismo medio del depósito dentro de los días hábiles siguientes.

9. CONDUCTA
Queda prohibido compartir cuentas, crear perfiles de terceros o intentar manipular resultados. La organización puede suspender cualquier perfil que incumpla estas cláusulas.

10. RESPONSABILIDAD
La participación es voluntaria y recreativa. La organización no se hace responsable por fallas de conexión, errores de captura del participante ni retrasos de los servicios bancarios.

11. CAMBIOS
Estas cláusulas pueden actualizarse. La versión vigente siempre está disponible dentro de la app.

Al crear tu perfil aceptas estas cláusulas.`;

/* ---------- Cálculos ---------- */
const miBoleto  = () => datos.boletos.find(b => b.usuario_id === yo?.id);
const usuarioDe = id => datos.usuarios.find(u => u.id === id) || {};
const nombreDe  = id => usuarioDe(id).nombre || 'Jugador';
const avatarDe  = id => usuarioDe(id).avatar || '⚽';
const waDe      = id => usuarioDe(id).whatsapp || '';
const verifDe   = id => !!usuarioDe(id).verificado;

function puntosDe(boletoId){
  let pts = 0;
  datos.pronosticos.filter(p => p.boleto_id === boletoId).forEach(p => {
    const par = datos.partidos.find(m => m.id === p.partido_id);
    if(par && par.resultado && par.resultado === p.pick) pts++;
  });
  return pts;
}
const bolsa = () => datos.jornada ? datos.boletos.filter(b => b.pagado).length * Number(datos.jornada.costo) : 0;
const listaJornada = () => datos.partidos.length >= META_PARTIDOS;

function tablaPosiciones(){
  const j = datos.jornada;
  const lista = datos.boletos.map(b => ({ ...b, nombre:nombreDe(b.usuario_id), avatar:avatarDe(b.usuario_id), verif:verifDe(b.usuario_id), puntos:puntosDe(b.id) }))
    .sort((a,b) => b.puntos - a.puntos || new Date(a.created_at) - new Date(b.created_at));
  const total = bolsa(), pcts = [j?.pct1||0, j?.pct2||0, j?.pct3||0];
  let lugar = 0, prev = null, i = 0;
  lista.forEach(f => { i++; if(f.puntos !== prev){ lugar = i; prev = f.puntos; } f.lugar = lugar; });
  lista.forEach(f => {
    const emp = lista.filter(x => x.lugar === f.lugar).length;
    const pct = pcts[f.lugar - 1] || 0;
    f.premio = pct ? (total * pct / 100) / emp : 0;
  });
  return lista;
}

function porLiga(lista){
  const g = [];
  lista.forEach(p => {
    const l = p.liga || 'Otra';
    let b = g.find(x => x.liga === l);
    if(!b){ b = { liga:l, partidos:[] }; g.push(b); }
    b.partidos.push(p);
  });
  g.sort((a,b) => ORDEN_LIGAS.indexOf(a.liga) - ORDEN_LIGAS.indexOf(b.liga));
  return g;
}

function armarTabs(){

    `<button class="tab ${tab===k?'on':''}" onclick="irA('${k}')">${n}${k==='admin'&&alerta?'<span class="punto"></span>':''}</button>`).join('');
}

function arrancarReloj(){
  const el = document.querySelector('[data-reloj]');
  if(!el) return;
  const limite = new Date(el.dataset.reloj).getTime();
  const tick = () => {
    const falta = limite - Date.now();
    if(falta <= 0){ el.innerHTML = '<span class="num">REGISTRO CERRADO</span>'; clearInterval(cuenta); return; }
    const d=Math.floor(falta/86400000), h=Math.floor(falta/3600000)%24, m=Math.floor(falta/60000)%60, s=Math.floor(falta/1000)%60;
    el.innerHTML = (d?`<span class="num">${d}</span><span class="etq">d</span>`:'')
      + `<span class="num">${String(h).padStart(2,'0')}</span><span class="etq">h</span>`
      + `<span class="num">${String(m).padStart(2,'0')}</span><span class="etq">m</span>`
      + `<span class="num">${String(s).padStart(2,'0')}</span><span class="etq">s</span>`
      + `<span class="etq">para el cierre</span>`;
  };
  tick(); cuenta = setInterval(tick, 1000);
}

async function guardarBoleta(){
  const j = datos.jornada;
  if(new Date(j.fecha_limite) <= new Date()){ await cargar(); return aviso('bolMsg','El registro acaba de cerrar.'); }
  if(!yo.verificado) return aviso('bolMsg','Primero verifica tu WhatsApp.');

  let boleto = miBoleto();

  if(!boleto){
    const costo = Number(j.costo);
    const { data:fresco } = await sb.from('usuarios').select('saldo').eq('id', yo.id).single();
    if(Number(fresco.saldo) < costo) { await cargar(); return aviso('bolMsg','Saldo insuficiente. Deposita para entrar.'); }

    const { data, error } = await sb.from('boletos')
      .insert({ jornada_id:j.id, usuario_id:yo.id, alias:yo.nombre, pagado:true }).select().single();
    if(error) return aviso('bolMsg','No se pudo registrar: ' + error.message);
    boleto = data;

    await sb.from('usuarios').update({ saldo: Number(fresco.saldo) - costo }).eq('id', yo.id);
    await sb.from('movimientos').insert({
      usuario_id:yo.id, tipo:'cargo', monto:-costo,
      concepto:`Boleta ${j.nombre}`, jornada_id:j.id, creado_por:yo.id
    });
  }

  const filas = Object.entries(borrador).map(([partido_id, pick]) => ({ boleto_id:boleto.id, partido_id, pick }));
  const { error } = await sb.from('pronosticos').upsert(filas, { onConflict:'boleto_id,partido_id' });
  if(error) return aviso('bolMsg','No se pudieron guardar los pronósticos: ' + error.message);

  historial = null;
  await cargar();
  aviso('bolMsg','Boleta registrada. Mucha suerte.','ok');
}

/* Pega la tabla como texto y la app la interpreta.
   Acepta: "1 América 10 8 22", "América, 10, +8, 22", "1. América 22" */
function parseTabla(txt){
  const filas = [];
  txt.split('\n').forEach(ln => {
    let l = ln.trim();
    if(!l) return;
    l = l.replace(/^\d+[.)\-]?\s+/, '');           // quita el lugar
    const nums = l.match(/-?\+?\d+/g) || [];
    const equipo = l.replace(/[,;|]/g,' ').replace(/-?\+?\d+/g,'').replace(/\s+/g,' ').trim();
    if(!equipo || equipo.length < 2) return;
    const n = nums.map(x => parseInt(x.replace('+',''),10));
    let jj=null, dif=null, pts=null;
    if(n.length >= 3){ jj=n[0]; dif=n[n.length-2]; pts=n[n.length-1]; }
    else if(n.length === 2){ jj=n[0]; pts=n[1]; }
    else if(n.length === 1){ pts=n[0]; }
    filas.push({ equipo, jj, dif, pts });
  });
  return filas;
}

async function guardarCalendario(){
  if(!esStaff()) return;
  const liga = $('clLiga').value;
  const lineas = $('clTexto').value.split('\n').map(x => x.trim()).filter(Boolean);
  const filas = [];
  lineas.forEach((ln, i) => {
    const partes = ln.split('|').map(x => x.trim());

    if(partes.length >= 2){ fecha = partes[0]; juego = partes[1]; canal = partes[2] || ''; }
    else { juego = partes[0]; }
    const m = juego.split(/\s+vs\.?\s+|\s+-\s+/i);
    if(m.length < 2) return;
    filas.push({ liga, fecha:fecha||null, local:m[0].trim(), visita:m[1].trim(), canal:canal||null, orden:i+1 });
  });
  if(!filas.length) return aviso('clMsg','No pude leer ningún partido. Usa el formato: Sáb 19:00 | América vs Chivas');
  await sb.from('calendario').delete().eq('liga', liga);

  if(error) return aviso('clMsg','No se pudo guardar: ' + error.message);
  await cargar();
  aviso('clMsg', `Calendario de ${liga} guardado con ${filas.length} partidos.`, 'ok');
}

/* Importador de titulares por RSS */
async function traerTitulares(){
  if(!esStaff()) return;
  const fuentes = ($('rsUrl').value || '').split('\n').map(x => x.trim()).filter(Boolean);
  if(!fuentes.length) return aviso('rsMsg','Pega al menos una dirección RSS.');
  aviso('rsMsg','Buscando titulares…','info');
  titularesRSS = [];
  for(const f of fuentes){
    try{
      const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(f));
      const xml = new DOMParser().parseFromString(await r.text(), 'text/xml');
      const items = [...xml.querySelectorAll('item, entry')].slice(0, 8);
      const medio = xml.querySelector('channel > title, feed > title')?.textContent?.trim() || '';
      items.forEach(it => titularesRSS.push({
        titulo: it.querySelector('title')?.textContent?.trim() || '',
        url: it.querySelector('link')?.getAttribute('href') || it.querySelector('link')?.textContent?.trim() || '',
        resumen: (it.querySelector('description, summary')?.textContent || '').replace(/<[^>]*>/g,'').trim().slice(0,240),
        fuente: medio
      }));
    }catch(e){ /* una fuente falló, seguimos con las demás */ }
  }
  await sb.from('config').upsert({ clave:'rss_fuentes', valor:fuentes.join('\n') }, { onConflict:'clave' });
  if(!titularesRSS.length) return aviso('rsMsg','No se pudo leer ninguna fuente. Revisa la dirección o publica la noticia a mano.');
  aviso('rsMsg', `${titularesRSS.length} titulares encontrados. Escoge cuáles publicar.`, 'ok');
  pintar();
}

async function publicarTitular(i){
  const t = titularesRSS[i]; if(!t) return;
  const { error } = await sb.from('noticias').insert({

    fuente:t.fuente || null, liga:$('ntLiga')?.value || null, autor_id:yo.id

  titularesRSS.splice(i,1);
  await cargar();
}

async function reportarDeposito(){
  const monto = Number($('dpMonto').value);
  const ref = $('dpRef').value.trim();
  if(!(monto > 0)) return aviso('dpMsg','Escribe cuánto depositaste.');
  if(ref.length < 3) return aviso('dpMsg','Pon una referencia para poder localizar tu depósito.');
  const { error } = await sb.from('depositos').insert({
    usuario_id:yo.id, monto, metodo:$('dpMetodo').value, referencia:ref, estado:'pendiente'
  });
  if(error) return aviso('dpMsg','No se pudo reportar: ' + error.message);

  await cargar();
  aviso('dpMsg','Depósito reportado. Te avisamos en cuanto se acredite.','ok');
}

async function pedirRetiro(){

  await cargar();
  aviso('rtMsg','Retiro solicitado.','ok');
}

async function cargarHistorial(){
  const ids = datos.jornadas.map(j => j.id);
  if(!ids.length){ historial = { jornadas:[], jugadas:0, aciertos:0, ganadas:0, premio:0 }; return pintar(); }
  const [bt, pt] = await Promise.all([
    sb.from('boletos').select('*').in('jornada_id', ids),
    sb.from('partidos').select('id,jornada_id,resultado').in('jornada_id', ids)
  ]);
  const boletos = bt.data || [], partidos = pt.data || [];
  const pr = boletos.length ? ((await sb.from('pronosticos').select('*').in('boleto_id', boletos.map(b=>b.id))).data || []) : [];

  const resumen = [];
  datos.jornadas.forEach(j => {
    const bs = boletos.filter(b => b.jornada_id === j.id);
    const ps = partidos.filter(p => p.jornada_id === j.id);
    const conRes = ps.filter(p => p.resultado).length;
    const marcados = bs.map(b => {
      let a = 0;
      pr.filter(x => x.boleto_id === b.id).forEach(x => {
        const par = ps.find(m => m.id === x.partido_id);
        if(par && par.resultado === x.pick) a++;
      });
      return { ...b, aciertos:a };
    }).sort((x,y) => y.aciertos - x.aciertos);
    const mio = marcados.find(b => b.usuario_id === yo.id);
    if(!mio) return;
    const mejor = marcados[0]?.aciertos ?? 0;
    const emp = marcados.filter(b => b.aciertos === mejor).length;
    const pag = marcados.filter(b => b.pagado).length;
    const gane = j.estado === 'finalizada' && mio.aciertos === mejor && conRes > 0;
    resumen.push({ jornada:j, aciertos:mio.aciertos, jugados:conRes, gane,
      premio: gane ? (pag * Number(j.costo) * (j.pct1/100)) / emp : 0 });
  });

  historial = { jornadas:resumen, jugadas:resumen.length,
    aciertos:resumen.reduce((s,r)=>s+r.aciertos,0),
    ganadas:resumen.filter(r=>r.gane).length,
    premio:resumen.reduce((s,r)=>s+r.premio,0) };
  pintar();
}

async function guardarPerfil(){

async function cambiarPin(){
  const viejo = $('pnViejo').value.trim(), nuevo = $('pnNuevo').value.trim();
  if(viejo !== yo.pin)   return aviso('pnMsg','Tu PIN actual no coincide.');
  if(!/^\d{4}$/.test(nuevo)) return aviso('pnMsg','El PIN nuevo debe tener 4 dígitos.');
  const { error } = await sb.from('usuarios').update({ pin:nuevo }).eq('id', yo.id);
  if(error) return aviso('pnMsg','No se pudo cambiar: ' + error.message);
  yo.pin = nuevo; $('pnViejo').value=''; $('pnNuevo').value='';
  aviso('pnMsg','PIN cambiado.','ok');
}

      <div class="campo"><label for="clTexto">Un partido por renglón</label>
        <textarea id="clTexto" placeholder="Sáb 19:00 | América vs Chivas | TUDN&#10;Sáb 21:00 | Tigres vs Monterrey | ESPN&#10;Dom 12:00 | Pumas vs Toluca"></textarea></div>
      <button class="btn" onclick="guardarCalendario()">Guardar calendario</button>
      <div id="clMsg"></div>
      <p class="mini">Formato: día y hora, barra, el partido con "vs", barra, canal. El canal es opcional.</p>
    </div></div>
  </div>` : ''}

  ${esDueno() ? `
  <div class="seccion">
    <h3>Módulos de la app</h3>
    <p>Prende o apaga secciones sin tocar el código.</p>
    <div class="card">
      ${[['noticias','Noticias'],['tablas','Tablas de posiciones'],['calendario','Calendario']].map(([k,n]) => `
        <div class="jrow">
          <div><div class="t">${n}</div><div class="s">${modOn(k)?'Visible para todos':'Oculta'}</div></div>
          <label class="switch">
            <input type="checkbox" ${modOn(k)?'checked':''} onchange="cambiarModulo('${k}',this.checked)">
            <span>${modOn(k)?'Encendido':'Apagado'}</span>
          </label>
        </div>`).join('')}
    </div>
    <p class="mini">Si apagas las tres, la pestaña Cancha desaparece del menú.</p>
  </div>` : ''}
  ${esDueno() ? `
  <div class="seccion">
    <h3>Datos de cobro</h3>
    <p>Lo que ven los participantes al depositar.</p>
    <div class="card"><div class="card-cuerpo">
      <div class="campo"><label for="cfWa">Tu WhatsApp de organización, con lada de país</label>
        <input id="cfWa" inputmode="tel" value="${esc(CFG.whatsapp_org||'')}" placeholder="529181234567"></div>
      <div class="fila2">
        <div class="campo"><label for="cfZn">Zelle a nombre de</label><input id="cfZn" value="${esc(CFG.zelle_nombre||'')}"></div>
        <div class="campo"><label for="cfZe">Correo o teléfono Zelle</label><input id="cfZe" value="${esc(CFG.zelle_email||'')}"></div>
      </div>
      <div class="campo"><label for="cfBn">Banco</label><input id="cfBn" value="${esc(CFG.banco_nombre||'')}"></div>
      <div class="fila2">
        <div class="campo"><label for="cfBt">Titular</label><input id="cfBt" value="${esc(CFG.banco_titular||'')}"></div>
        <div class="campo"><label for="cfBc">CLABE o cuenta</label><input id="cfBc" value="${esc(CFG.banco_clabe||'')}"></div>
      </div>
      <button class="btn" onclick="guardarCobro()">Guardar datos de cobro</button>
      <div id="cfMsg"></div>
    </div></div>
  </div>

  <div class="seccion">
    <h3>Cláusulas de participación</h3>
    <p>Se muestran al registrarse y en el perfil de cada quien.</p>
    <div class="card"><div class="card-cuerpo">
      <div class="campo"><textarea id="cfTerm">${esc(terminos())}</textarea></div>
      <button class="btn fantasma" onclick="guardarTerminos()">Guardar cláusulas</button>
      <div id="ctMsg"></div>
    </div></div>
  </div>

  <div class="seccion">
    <h3>Equipo</h3>
    <div class="card">${datos.usuarios.filter(u => !esJugador(u)).map(u => `
      <div class="jrow">
        <div><div class="t">${u.avatar||'⚽'} ${esc(u.nombre)}</div><div class="s">${esc(u.whatsapp)} · ${tituloRol(u.rol)}</div></div>
        ${u.rol==='organizador' ? `<button class="btn chico fantasma" onclick="resetPin('${u.id}','${esc(u.nombre)}')">Cambiar PIN</button>` : '<span class="etiqueta ok">Tú</span>'}
      </div>`).join('')}</div>
    <p class="mini">Guse organiza jornadas y verifica participantes. No toca depósitos, retiros, saldos ni el cierre final.</p>
  </div>` : ''}`;
}

function panelJornada(j){
  const n = datos.partidos.length;
  const mx = datos.partidos.filter(p => p.liga === 'Liga MX').length;
  const barritas = Array.from({length: Math.max(META_PARTIDOS, n)}, (_,i) => {
    const p = datos.partidos[i];
    return `<div class="barrita ${p ? (p.liga==='Liga MX'?'mx':'on') : ''}"></div>`;
  }).join('');

  const listaPartidos = porLiga(datos.partidos).map(g => `
    <div class="grupo">${esc(abrevia(g.liga))}</div>
    ${g.partidos.map(p => `
      <div class="filap">
        <div class="equipos">
          <div class="l"><span class="num-p">${p.orden}</span>${esc(p.local)}</div>
          <div class="vs">VS</div>
          <div class="v">${esc(p.visita)}</div>
          ${p.hora ? `<div class="hr">${esc(p.hora)}</div>` : ''}
        </div>
        <div class="picks">
          ${['L','E','V'].map(v => `<button class="pick ${p.resultado===v?'sel':''}" onclick="ponerResultado('${p.id}','${v}')">${v}</button>`).join('')}
          <button class="pick" onclick="quitarPartido('${p.id}')" title="Quitar">×</button>
        </div>
      </div>`).join('')}`).join('');

  const boletos = datos.boletos.map(b => `
    <div class="jrow">
      <div><div class="t">${avatarDe(b.usuario_id)} ${esc(nombreDe(b.usuario_id))}</div>
        <div class="s">${bonito(waDe(b.usuario_id))} · ${puntosDe(b.id)} aciertos</div></div>
      <span class="etiqueta ok">Pagada</span>
    </div>`).join('') || '<div class="vacio">Sin boletas todavía.</div>';

  return `
  <div class="seccion">
    <h3>${esc(j.nombre)}</h3>
    <p>${j.estado} · bolsa ${dinero(bolsa())} · ${datos.boletos.length} boletas</p>

    <div class="card"><div class="card-cuerpo">
      <div class="progreso">
        <div class="cifra">${n}/${META_PARTIDOS}</div>
        <div class="txt">${mx} Liga MX · ${n-mx} Europa<br>
          ${n < META_PARTIDOS ? `Faltan ${META_PARTIDOS-n}. La jornada no se abre hasta completar los ${META_PARTIDOS}.` : (n === META_PARTIDOS ? 'Jornada completa y visible para todos' : `Llevas ${n-META_PARTIDOS} de más`)}</div>
      </div>
      <div class="barritas">${barritas}</div>

      <div class="campo"><label for="apLiga">Liga</label>
        <select id="apLiga" onchange="cambiarLiga(this.value)">
          ${ORDEN_LIGAS.map(l => `<option ${l===ligaSel?'selected':''}>${l}</option>`).join('')}
        </select></div>
      <div class="fila2">
        <div class="campo"><label for="apLocal">Local</label>
          <input id="apLocal" list="listaEquipos" autocomplete="off" placeholder="Escribe o elige"></div>
        <div class="campo"><label for="apVisita">Visitante</label>
          <input id="apVisita" list="listaEquipos" autocomplete="off" placeholder="Escribe o elige"></div>
      </div>
      <div class="campo"><label for="apHora">Día y hora</label>
        <input id="apHora" list="listaHoras" placeholder="Sáb 19:00"></div>
      <datalist id="listaHoras">
        <option>Sáb 12:00</option><option>Sáb 17:00</option><option>Sáb 19:00</option><option>Sáb 21:00</option>
        <option>Dom 12:00</option><option>Dom 17:00</option><option>Dom 19:00</option><option>Dom 21:00</option>
      </datalist>
      <button class="btn" onclick="agregarPartido()">Agregar partido</button>
      <div id="apMsg"></div>
    </div></div>

    ${n ? `<div class="card">
      <div class="card-cab"><h3>Partidos y resultados</h3><em>toca L · E · V</em></div>
      ${listaPartidos}
    </div>` : ''}

    <div class="${esDueno()?'fila2':''}" style="margin-top:14px">
      <button class="btn fantasma" onclick="cambiarEstado('${j.estado==='abierta'?'cerrada':'abierta'}')">
        ${j.estado==='abierta'?'Cerrar registro':'Reabrir registro'}
      </button>
      ${esDueno() ? `<button class="btn" onclick="finalizarJornada()" ${j.premios_pagados?'disabled':''}>${j.premios_pagados?'Premios pagados':'Finalizar y pagar'}</button>` : ''}
    </div>
    ${!esDueno() ? `<p class="mini">El cierre final y el pago de premios los maneja Jared.</p>` : ''}
    <button class="btn fantasma" onclick="convocar()">Convocar por WhatsApp</button>

    <div class="card">
      <div class="card-cab"><h3>Boletas de esta jornada</h3></div>
      ${boletos}
    </div>
  </div>`;
}

function cambiarLiga(l){ ligaSel = l; refrescarEquipos(); $('apLocal')?.focus(); }
function refrescarEquipos(){
  const dl = $('listaEquipos'); if(!dl) return;
  dl.innerHTML = (LIGAS[ligaSel] || []).map(e => `<option value="${esc(e)}"></option>`).join('');
}

async function crearJornada(){
  const nombre = $('njNombre').value.trim(), costo = Number($('njCosto').value), limite = $('njLimite').value;
  if(nombre.length < 3) return aviso('njMsg','Ponle nombre a la jornada.');
  if(!limite)           return aviso('njMsg','Falta la fecha de cierre.');
  const { data, error } = await sb.from('jornadas').insert({
    nombre, costo, moneda:$('njMoneda').value, fecha_limite:new Date(limite).toISOString(),
    pct1:Number($('njP1').value)||0, pct2:Number($('njP2').value)||0, pct3:Number($('njP3').value)||0
  }).select().single();
  if(error) return aviso('njMsg','No se pudo crear: ' + error.message);
  jornadaVista = data.id; historial = null; await cargar();
}

async function agregarPartido(){
  const local = $('apLocal').value.trim(), visita = $('apVisita').value.trim();
  if(!local || !visita) return aviso('apMsg','Faltan los dos equipos.');
  if(local.toLowerCase() === visita.toLowerCase()) return aviso('apMsg','Un equipo no juega contra sí mismo.');
  if(datos.partidos.length >= META_PARTIDOS) return aviso('apMsg',`Ya tienes los ${META_PARTIDOS} partidos. Quita uno si quieres cambiarlo.`);
  const { error } = await sb.from('partidos').insert({
    jornada_id: datos.jornada.id, orden: datos.partidos.length + 1,
    liga: ligaSel, local, visita, hora: $('apHora').value.trim() || null
  });
  if(error) return aviso('apMsg','No se pudo agregar: ' + error.message);
  $('apLocal').value=''; $('apVisita').value='';
  await cargar(); $('apLocal')?.focus();
}

async function quitarPartido(id){
  if(!confirm('¿Quitar este partido? Se borran también los pronósticos de ese partido.')) return;
  await sb.from('partidos').delete().eq('id', id);
  const rest = datos.partidos.filter(p => p.id !== id);
  for(let i=0;i<rest.length;i++) if(rest[i].orden !== i+1) await sb.from('partidos').update({orden:i+1}).eq('id',rest[i].id);
  await cargar();
}

async function ponerResultado(id, v){
  const actual = datos.partidos.find(p => p.id === id)?.resultado;
  await sb.from('partidos').update({ resultado: actual === v ? null : v }).eq('id', id);
  historial = null; await cargar();
}

async function cambiarEstado(estado){
  await sb.from('jornadas').update({ estado }).eq('id', datos.jornada.id);
  historial = null; await cargar();
}

async function finalizarJornada(){
  if(!esDueno()) return;
  const j = datos.jornada;
  if(j.premios_pagados) return alert('Los premios de esta jornada ya se pagaron.');
  const lista = tablaPosiciones().filter(f => f.premio > 0);
  if(!lista.length) return alert('Todavía no hay premios que repartir. Captura los resultados primero.');
  const resumen = lista.map(f => `${f.nombre}: ${dinero(f.premio)}`).join('\n');
  if(!confirm(`Se van a abonar estos premios a los monederos:\n\n${resumen}\n\n¿Confirmas?`)) return;

  for(const f of lista){
    const { data:u } = await sb.from('usuarios').select('saldo').eq('id', f.usuario_id).single();
    await sb.from('usuarios').update({ saldo: Number(u.saldo) + f.premio }).eq('id', f.usuario_id);
    await sb.from('movimientos').insert({
      usuario_id:f.usuario_id, tipo:'premio', monto:f.premio,
      concepto:`Premio ${j.nombre} · ${f.lugar}º lugar`, jornada_id:j.id, creado_por:yo.id
    });
  }
  await sb.from('jornadas').update({ estado:'finalizada', premios_pagados:true }).eq('id', j.id);
  historial = null; await cargar();
  alert('Premios abonados.');
}

async function resolverDeposito(id, aprobar){
  if(!esDueno()) return;
  const d = datos.depositos.find(x => x.id === id); if(!d) return;
  if(aprobar){
    const { data:u } = await sb.from('usuarios').select('saldo').eq('id', d.usuario_id).single();
    await sb.from('usuarios').update({ saldo: Number(u.saldo) + Number(d.monto) }).eq('id', d.usuario_id);
    await sb.from('movimientos').insert({
      usuario_id:d.usuario_id, tipo:'deposito', monto:Number(d.monto),
      concepto:`Depósito por ${d.metodo}`, creado_por:yo.id
    });
    await sb.from('depositos').update({ estado:'aprobado', revisado_por:yo.id }).eq('id', id);
  } else {
    const nota = prompt('Motivo del rechazo (lo va a ver el participante):') || 'No se localizó el depósito';
    await sb.from('depositos').update({ estado:'rechazado', nota, revisado_por:yo.id }).eq('id', id);
  }
  await cargar();
}

async function resolverRetiro(id, pagado){
  if(!esDueno()) return;
  const r = datos.retiros.find(x => x.id === id); if(!r) return;
  if(pagado){
    const { data:u } = await sb.from('usuarios').select('saldo').eq('id', r.usuario_id).single();
    if(Number(u.saldo) < Number(r.monto)) return alert('El participante ya no tiene ese saldo.');
    await sb.from('usuarios').update({ saldo: Number(u.saldo) - Number(r.monto) }).eq('id', r.usuario_id);
    await sb.from('movimientos').insert({
      usuario_id:r.usuario_id, tipo:'retiro', monto:-Number(r.monto), concepto:'Retiro pagado', creado_por:yo.id
    });
    await sb.from('retiros').update({ estado:'pagado', revisado_por:yo.id }).eq('id', id);
  } else {
    await sb.from('retiros').update({ estado:'rechazado', revisado_por:yo.id }).eq('id', id);
  }
  await cargar();
}

async function ajustarSaldo(id, nombre){
  if(!esDueno()) return;
  const txt = prompt(`Ajuste de saldo para ${nombre}.\nPon un número positivo para abonar o negativo para descontar:`);
  if(txt === null) return;
  const monto = Number(txt);
  if(!monto) return;
  const concepto = prompt('Concepto del ajuste:') || 'Ajuste manual';
  const { data:u } = await sb.from('usuarios').select('saldo').eq('id', id).single();
  await sb.from('usuarios').update({ saldo: Number(u.saldo) + monto }).eq('id', id);
  await sb.from('movimientos').insert({ usuario_id:id, tipo:'ajuste', monto, concepto, creado_por:yo.id });
  await cargar();
}

async function verificarJugador(id, aprobar){
  if(aprobar){
    await sb.from('usuarios').update({ verificado:true }).eq('id', id);
  } else {
    if(!confirm('¿Borrar este perfil? Se va junto con sus boletas y su saldo.')) return;
    await sb.from('usuarios').delete().eq('id', id);
  }
  await cargar();
}

async function alternarJugador(id, activo){
  await sb.from('usuarios').update({ activo: !activo }).eq('id', id);
  await cargar();
}

async function resetPin(id, nombre){
  if(!esDueno()) return;
  const nuevo = prompt(`PIN nuevo de 4 dígitos para ${nombre}:`);
  if(nuevo === null) return;
  if(!/^\d{4}$/.test(nuevo)) return alert('Tienen que ser 4 dígitos.');
  const { error } = await sb.from('usuarios').update({ pin:nuevo }).eq('id', id);
  alert(error ? 'No se pudo: ' + error.message : `Listo. El PIN de ${nombre} ahora es ${nuevo}.`);
}

async function guardarCobro(){
  if(!esDueno()) return;
  const pares = {
    whatsapp_org: soloD($('cfWa').value),
    zelle_nombre: $('cfZn').value.trim(),
    zelle_email:  $('cfZe').value.trim(),
    banco_nombre: $('cfBn').value.trim(),
    banco_titular:$('cfBt').value.trim(),
    banco_clabe:  $('cfBc').value.trim()
  };
  for(const [clave, valor] of Object.entries(pares)){
    await sb.from('config').upsert({ clave, valor }, { onConflict:'clave' });
  }
  await cargar();
  aviso('cfMsg','Datos de cobro guardados.','ok');
}

async function guardarTerminos(){
  if(!esDueno()) return;
  const valor = $('cfTerm').value.trim();
  if(valor.length < 50) return aviso('ctMsg','El texto quedó muy corto.');
  await sb.from('config').upsert({ clave:'terminos', valor }, { onConflict:'clave' });
  await cargar();
  aviso('ctMsg','Cláusulas guardadas.','ok');
}

function convocar(){
  const j = datos.jornada;
  let t = `*QUINIELAS EL PIJI ACHOTERO*\n${j.nombre}\n\n`;
  t += `Costo: ${dinero(j.costo)} ${j.moneda}\nCierra: ${fechaMX(j.fecha_limite)}\nBolsa actual: ${dinero(bolsa())}\nGana quien más aciertos junte.\n\n`;
  porLiga(datos.partidos).forEach(g => {
    t += `_${abrevia(g.liga)}_\n`;
    g.partidos.forEach(p => t += `${p.orden}. ${p.local} vs ${p.visita}${p.hora?' · '+p.hora:''}\n`);
    t += `\n`;
  });
  t += `Crea tu perfil y llena tu boleta: ${location.origin}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

/* ---------- Arranque ---------- */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const id = document.activeElement?.id;
  if(['lgWa','lgPin'].includes(id)) entrar();
  else if(['rgNombre','rgWa','rgPin'].includes(id)) registrar();
  else if(['apVisita','apHora'].includes(id)) agregarPartido();
});
sesionGuardada();
</script>
</body>
</html>
