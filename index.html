<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quinielas El Piji Achotero</title>
<meta name="theme-color" content="#0B1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --fondo:#0B1220; --panel:#131C2E; --panel-2:#182338; --linea:#23314C;
  --texto:#EDF0F5; --suave:rgba(237,240,245,.60); --tenue:rgba(237,240,245,.20);
  --oro:#D4A438; --oro-alto:#E8C46A; --oro-hondo:#9A7415;
  --mx:#0E7A4F; --us:#1D4E89; --rojo:#C0392B; --verde:#12A06A;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--fondo);color:var(--texto);font:400 16px/1.55 'Barlow',system-ui,sans-serif;min-height:100vh;padding-bottom:70px}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 15% -5%, rgba(14,122,79,.16), transparent 60%),
             radial-gradient(900px 500px at 85% -5%, rgba(29,78,137,.18), transparent 60%)}
h1,h2,h3,.cond{font-family:'Barlow Condensed','Barlow',sans-serif;line-height:1.06;letter-spacing:.005em}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--oro)}
.wrap{max-width:660px;margin:0 auto;padding:0 16px}
.hide{display:none !important}

/* ---------- BARRA ---------- */
.barra{background:rgba(11,18,32,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--linea)}
.tricolor{height:3px;background:linear-gradient(90deg,var(--mx) 0 16%,#F2F2F2 16% 22%,var(--rojo) 22% 38%,transparent 38% 46%,var(--us) 46% 62%,#F2F2F2 62% 68%,var(--rojo) 68% 84%,var(--us) 84% 100%)}
.barra-in{display:flex;align-items:center;gap:12px;padding:11px 16px;max-width:660px;margin:0 auto}
.barra h1{font-size:19px;font-weight:700;text-transform:uppercase}
.barra small{display:block;font-size:11px;color:var(--suave);letter-spacing:.09em;text-transform:uppercase;font-family:'Barlow';font-weight:500}
.salir{margin-left:auto;font-size:13px;color:var(--suave);padding:6px 12px;border:1px solid var(--linea);border-radius:999px}

/* ---------- TABS ---------- */
.tabs{background:rgba(11,18,32,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:39;border-bottom:1px solid var(--linea)}
.tabs-in{display:flex;max-width:660px;margin:0 auto;width:100%;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:82px;padding:13px 12px;font-family:'Barlow Condensed';font-size:16px;font-weight:600;text-transform:uppercase;color:var(--suave);border-bottom:2px solid transparent;position:relative}
.tab.on{color:var(--texto);border-bottom-color:var(--oro)}
.punto{position:absolute;top:9px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--oro)}

/* ---------- CARDS ---------- */
.card{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;margin-top:16px}
.card-cab{padding:13px 16px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:center;background:var(--panel-2)}
.card-cab h3{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card-cab em{font-style:normal;font-size:12px;color:var(--suave)}
.card-cuerpo{padding:16px}

/* ---------- MARCADOR ---------- */
.marcador{background:var(--panel);border:1px solid var(--linea);border-radius:var(--r);margin-top:16px;overflow:hidden}
.marcador-top{padding:17px 18px 15px}
.marcador-top h2{font-size:25px;font-weight:700;text-transform:uppercase}
.marcador-top p{font-size:13px;color:var(--suave);margin-top:4px}
.reloj{display:flex;gap:9px;padding:0 18px 16px;align-items:baseline;flex-wrap:wrap}
.reloj .num{font-family:'Barlow Condensed';font-size:34px;font-weight:700;color:var(--oro);line-height:1;font-variant-numeric:tabular-nums}
.reloj .etq{font-size:12px;color:var(--suave);letter-spacing:.05em}
.bolsa{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--panel-2);border-top:1px solid var(--linea)}
.bolsa b{font-family:'Barlow Condensed';font-size:30px;font-weight:700;color:var(--oro);font-variant-numeric:tabular-nums}
.bolsa span{font-size:12px;color:var(--suave);line-height:1.4}

/* ---------- PARTIDOS ---------- */
.grupo{padding:9px 16px;background:var(--panel-2);border-bottom:1px solid var(--linea);font-family:'Barlow Condensed';font-size:13px;font-weight:700;letter-spacing:.13em;color:var(--oro);text-transform:uppercase}
.filap{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--linea);align-items:center}
.filap:last-child{border-bottom:none}
.equipos{min-width:0}
.equipos .l,.equipos .v{font-weight:600;font-size:15px}
.equipos .vs{font-size:10px;color:var(--suave);letter-spacing:.16em;margin:3px 0}
.equipos .hr{font-size:12px;color:var(--suave);margin-top:5px}
.num-p{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;background:var(--linea);font-family:'Barlow Condensed';font-size:12px;color:var(--oro);font-weight:700;margin-right:8px;vertical-align:1px}
.picks{display:flex;gap:6px}
.pick{width:46px;height:46px;border-radius:11px;border:1px solid var(--linea);background:var(--panel-2);
  font-family:'Barlow Condensed';font-size:19px;font-weight:700;color:var(--suave);display:grid;place-items:center;
  transition:transform .07s,background .15s,color .15s}
.pick:active:not(:disabled){transform:scale(.94)}
.pick:disabled{opacity:.45;cursor:default}
.pick.sel{color:#fff;border-color:transparent}
.pick.sel:nth-child(1){background:var(--mx)}
.pick.sel:nth-child(2){background:var(--oro);color:#201804}
.pick.sel:nth-child(3){background:var(--us)}
.pick.acierto{outline:2px solid var(--verde);outline-offset:2px}
.pick.fallo{outline:2px solid var(--rojo);outline-offset:2px}
.res-chip{font-size:11px;color:var(--oro);margin-top:6px;letter-spacing:.05em;font-weight:600}

/* ---------- BOTONES ---------- */
.btn{display:block;width:100%;padding:15px;border-radius:12px;background:var(--oro);color:#201804;
  font-family:'Barlow Condensed';font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  margin-top:14px;transition:transform .07s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.985);opacity:.9}
.btn:disabled{background:var(--linea);color:var(--suave);cursor:default}
.btn.fantasma{background:transparent;border:1px solid var(--linea);color:var(--texto)}
.btn.chico{width:auto;padding:9px 15px;font-size:15px;margin-top:0}
.btn.roja{background:var(--rojo);color:#fff}
.btn.verde{background:var(--verde);color:#04210F}

/* ---------- TABLA ---------- */
.pos{display:grid;grid-template-columns:28px 32px 1fr auto auto;gap:10px;padding:12px 16px;align-items:center;border-bottom:1px solid var(--linea)}
.pos:last-child{border-bottom:none}
.pos .lug{font-family:'Barlow Condensed';font-size:19px;font-weight:700;color:var(--suave);text-align:center}
.pos.p1{background:linear-gradient(90deg,rgba(212,164,56,.12),transparent)}
.pos.p1 .lug{color:var(--oro);font-size:23px}
.pos .av{font-size:22px;text-align:center;line-height:1}
.pos .nom{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .nom small{display:block;font-weight:500;font-size:11px;color:var(--suave)}
.pos .pts{font-family:'Barlow Condensed';font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.pos .prem{font-size:13px;color:var(--oro);font-weight:700}
.rojo{color:#F08A7E}

/* ---------- FORM ---------- */
.campo{margin-top:14px}
.campo label{display:block;font-size:13px;color:var(--suave);margin-bottom:7px;font-weight:500}
.campo input,.campo select,.campo textarea{width:100%;padding:13px 14px;border-radius:11px;background:var(--fondo);border:1px solid var(--linea);color:var(--texto)}
.campo textarea{min-height:180px;resize:vertical;font-size:14px;line-height:1.6}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--oro);border-color:transparent}
.campo input::placeholder,.campo textarea::placeholder{color:rgba(237,240,245,.30)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fila3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.lada{display:grid;grid-template-columns:118px 1fr;gap:10px}

/* ---------- ENTRADA ---------- */
.entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.entrada-caja{width:100%;max-width:420px}
.marca{text-align:center;margin-bottom:24px}
.marca svg{width:104px;height:104px;display:block;margin:0 auto 14px}
.marca h1{font-size:31px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.marca .lema{font-size:11px;color:var(--oro);margin-top:9px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.cambio{text-align:center;margin-top:18px;font-size:14px;color:var(--suave)}
.cambio button{color:var(--oro);font-weight:600;text-decoration:underline}

/* ---------- SALDO ---------- */
.monedero{background:linear-gradient(135deg,var(--panel-2),var(--panel));border:1px solid var(--linea);border-radius:18px;padding:22px;margin-top:16px;position:relative;overflow:hidden}
.monedero::after{content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(212,164,56,.16),transparent 70%)}
.monedero .etq{font-size:11px;color:var(--suave);letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.monedero .cifra{font-family:'Barlow Condensed';font-size:52px;font-weight:700;color:var(--oro);line-height:1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.monedero .sub{font-size:13px;color:var(--suave)}
.mov{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--linea)}
.mov:last-child{border-bottom:none}
.mov .d{font-size:14px;font-weight:600}
.mov .f{font-size:12px;color:var(--suave);margin-top:2px}
.mov .m{font-family:'Barlow Condensed';font-size:19px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.mov .m.suma{color:var(--verde)}
.mov .m.resta{color:#F08A7E}
.datos-pago{background:var(--fondo);border:1px dashed var(--linea);border-radius:12px;padding:14px;margin-top:12px}
.dp{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--linea)}
.dp:last-child{border-bottom:none}
.dp span{color:var(--suave)}
.dp b{font-weight:600;text-align:right;word-break:break-all}

/* ---------- PERFIL ---------- */
.credencial{margin-top:16px;border-radius:18px;overflow:hidden;border:1px solid var(--linea);background:var(--panel)}
.credencial .tira{height:5px;background:linear-gradient(90deg,var(--mx) 0 18%,#F2F2F2 18% 25%,var(--rojo) 25% 42%,var(--us) 50% 68%,#F2F2F2 68% 76%,var(--rojo) 76% 100%)}
.cred-cuerpo{display:flex;align-items:center;gap:16px;padding:20px 18px}
.cred-av{width:72px;height:72px;flex:0 0 72px;border-radius:20px;background:var(--panel-2);display:grid;place-items:center;font-size:34px;border:1px solid var(--oro)}
.cred-cuerpo h2{font-size:25px;font-weight:700}
.cred-cuerpo p{font-size:13px;color:var(--suave);margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--linea);border-radius:12px;padding:15px 8px;text-align:center}
.stat b{display:block;font-family:'Barlow Condensed';font-size:29px;font-weight:700;color:var(--oro);line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;color:var(--suave);margin-top:6px}
.avatares{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.av-op{width:48px;height:48px;border-radius:13px;border:1px solid var(--linea);background:var(--panel-2);font-size:24px;display:grid;place-items:center}
.av-op.sel{border-color:var(--oro);background:rgba(212,164,56,.16)}

/* ---------- VARIOS ---------- */
.vacio{text-align:center;padding:42px 20px;color:var(--suave);font-size:15px}
.aviso{padding:13px 15px;border-radius:11px;font-size:14px;margin-top:14px;border-left:3px solid;line-height:1.5}
.aviso.err{background:rgba(192,57,43,.14);border-color:var(--rojo)}
.aviso.ok{background:rgba(18,160,106,.14);border-color:var(--verde)}
.aviso.info{background:rgba(212,164,56,.11);border-color:var(--oro)}
.seccion{margin-top:26px}
.seccion > h3{font-family:'Barlow Condensed';font-size:20px;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.seccion > p{font-size:13px;color:var(--suave)}
.jrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--linea)}
.jrow:last-child{border-bottom:none}
.jrow .t{font-weight:600;font-size:15px}
.jrow .s{font-size:12px;color:var(--suave);margin-top:3px}
.etiqueta{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.etiqueta.abierta,.etiqueta.ok{background:rgba(18,160,106,.20);color:#4FD8A0}
.etiqueta.cerrada,.etiqueta.pend{background:rgba(212,164,56,.18);color:var(--oro)}
.etiqueta.finalizada{background:var(--linea);color:var(--suave)}
.etiqueta.borrador{background:rgba(29,78,137,.30);color:#8FB6E8}
.etiqueta.mal{background:rgba(192,57,43,.20);color:#F08A7E}
.cargando{text-align:center;padding:50px;color:var(--suave)}
.switch{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.switch input{width:19px;height:19px;accent-color:var(--oro);flex:0 0 19px}
.mini{font-size:12px;color:var(--suave);margin-top:9px;line-height:1.5}
.progreso{display:flex;align-items:center;gap:13px;margin-top:6px}
.progreso .cifra{font-family:'Barlow Condensed';font-size:30px;font-weight:700;color:var(--oro);line-height:1}
.progreso .txt{font-size:13px;color:var(--suave)}
.barritas{display:flex;gap:3px;margin-top:9px}
.barrita{height:6px;flex:1;border-radius:3px;background:var(--linea)}
.barrita.on{background:var(--us)}
.barrita.mx{background:var(--mx)}
.ver-caja{text-align:center;padding:24px 18px}
.ver-caja .cod{font-family:'Barlow Condensed';font-size:52px;font-weight:700;color:var(--oro);letter-spacing:.2em;line-height:1;margin:13px 0}
.chip-ver{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:rgba(18,160,106,.20);color:#4FD8A0;margin-left:6px}
.chip-no{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 9px;border-radius:999px;background:rgba(192,57,43,.20);color:#F08A7E;margin-left:6px}
.legal{font-size:13px;line-height:1.65;color:var(--suave);white-space:pre-wrap}
.legal strong{color:var(--texto)}
.subtabs{display:flex;gap:8px;margin-top:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subtabs::-webkit-scrollbar{display:none}
.subtab{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid var(--linea);background:var(--panel);
  font-family:'Barlow Condensed';font-size:15px;font-weight:600;text-transform:uppercase;color:var(--suave)}
.subtab.on{background:var(--oro);color:#201804;border-color:transparent}

.noti{padding:16px;border-bottom:1px solid var(--linea)}
.noti:last-child{border-bottom:none}
.noti .cab{display:flex;gap:9px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.noti .liga{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--oro)}
.noti .fecha{font-size:11px;color:var(--suave)}
.noti h4{font-family:'Barlow Condensed';font-size:21px;font-weight:700;line-height:1.15}
.noti p{font-size:14px;color:var(--suave);margin-top:7px;line-height:1.55}
.noti .cuerpo{font-size:14px;margin-top:9px;line-height:1.65;white-space:pre-wrap}
.noti a.leer{display:inline-block;margin-top:10px;font-size:13px;font-weight:600}
.noti img{width:100%;border-radius:11px;margin-top:11px;display:block}
.pin{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:rgba(212,164,56,.18);color:var(--oro)}

.tliga{width:100%;border-collapse:collapse;font-size:14px}
.tliga th{font-family:'Barlow Condensed';font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave);
  font-weight:600;padding:10px 6px;border-bottom:1px solid var(--linea);text-align:right}
.tliga th:nth-child(1),.tliga th:nth-child(2){text-align:left}
.tliga td{padding:10px 6px;border-bottom:1px solid var(--linea);text-align:right;font-variant-numeric:tabular-nums}
.tliga td:nth-child(1){width:28px;color:var(--suave);font-family:'Barlow Condensed';font-weight:700;text-align:left}
.tliga td:nth-child(2){text-align:left;font-weight:600}
.tliga tr:last-child td{border-bottom:none}
.tliga tr.zona td:nth-child(1){color:var(--oro)}
.tliga .pts{font-family:'Barlow Condensed';font-size:17px;font-weight:700;color:var(--oro)}

.calf{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:13px 16px;border-bottom:1px solid var(--linea);align-items:center}
.calf:last-child{border-bottom:none}
.calf .cuando{font-family:'Barlow Condensed';font-size:14px;font-weight:600;color:var(--oro);line-height:1.25}
.calf .juego{font-size:15px;font-weight:600}
.calf .canal{font-size:12px;color:var(--suave);margin-top:3px}
.firma{margin:26px 0 10px;border-radius:var(--r);overflow:hidden;border:1px solid var(--linea);background:linear-gradient(135deg,var(--panel-2),var(--panel))}
.firma .barra-jr{height:3px;background:linear-gradient(90deg,var(--mx),var(--oro),var(--us))}
.firma-in{display:flex;align-items:center;gap:14px;padding:15px 16px}
.firma .ico{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--oro);color:#201804;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:15px;letter-spacing:.02em}
.firma .t{font-family:'Barlow Condensed';font-size:18px;font-weight:700;text-transform:uppercase;line-height:1.1}
.firma .s{font-size:12px;color:var(--suave);margin-top:3px}
.firma .cta{margin-left:auto;padding:9px 14px;border-radius:999px;background:var(--oro);color:#201804;font-family:'Barlow Condensed';font-size:15px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.creditos{text-align:center;font-size:11px;color:var(--tenue);padding:18px 16px 6px;letter-spacing:.05em}

.envivo{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4FD8A0}
.envivo i{width:7px;height:7px;border-radius:50%;background:#4FD8A0;animation:lat 1.6s ease-in-out infinite}
@keyframes lat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

.barra-ac{height:5px;border-radius:3px;background:var(--linea);overflow:hidden;margin-top:5px}
.barra-ac i{display:block;height:100%;background:linear-gradient(90deg,var(--mx),var(--oro));border-radius:3px;transition:width .5s ease}

/* rejilla de pronósticos */
.rejilla{overflow-x:auto;padding:0 0 4px}
.rejilla table{border-collapse:collapse;font-size:13px;min-width:100%}
.rejilla th{font-family:'Barlow Condensed';font-size:11px;letter-spacing:.06em;color:var(--suave);font-weight:600;padding:9px 4px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap}
.rejilla th.who{text-align:left;padding-left:16px;position:sticky;left:0;background:var(--panel);z-index:2;min-width:132px}
.rejilla td{padding:7px 4px;border-bottom:1px solid var(--linea);text-align:center}

async function registrar(){
  const nombre = $('rgNombre').value.trim();
  const pais   = $('rgPais').value;
  const num    = d10($('rgWa').value);
  const pin    = $('rgPin').value.trim();

  if(nombre.length < 3) return aviso('rgMsg','Escribe tu nombre completo.');
  if(num.length !== 10) return aviso('rgMsg','El número debe tener 10 dígitos, sin lada de país.');
  if(/^(\d)\1{9}$/.test(num)) return aviso('rgMsg','Ese número no es real. Pon tu WhatsApp de verdad.');
  if(pais === '52' && num[0] === '0') return aviso('rgMsg','Un número de México no empieza con 0.');
  if(pin.length !== 4) return aviso('rgMsg','El PIN debe tener 4 dígitos.');
  if(!$('rgTerm').checked) return aviso('rgMsg','Tienes que aceptar las cláusulas para participar.');

  const { data:existe } = await sb.from('usuarios').select('id').ilike('whatsapp','%'+num).maybeSingle();
  if(existe) return aviso('rgMsg','Ese WhatsApp ya tiene perfil. Entra con tu PIN.');

  const { data, error } = await sb.from('usuarios').insert({
    nombre, whatsapp: pais + num, pais, pin, rol:'jugador',
    avatar:avatarNuevo, verificado:false, codigo_verif:nuevoCodigo(), saldo:0
  }).select().single();
  if(error) return aviso('rgMsg','No se pudo crear el perfil: ' + error.message);

  await traerConfig();
  pantallaVerificar(data);
}

async function entrar(){
  const wa = $('lgWa').value.trim(), pin = $('lgPin').value.trim();
  if(!wa || !pin) return aviso('lgMsg','Faltan tus datos.');
  let data = null;
  if(/^\d/.test(wa)){
    const r = await sb.from('usuarios').select('*').ilike('whatsapp','%'+d10(wa));
    data = (r.data || [])[0] || null;
  } else {
    const r = await sb.from('usuarios').select('*').eq('whatsapp', wa.toUpperCase()).maybeSingle();
    data = r.data;
  }
  if(!data)            return aviso('lgMsg','No encontramos ese perfil.');
  if(data.pin !== pin) return aviso('lgMsg','PIN incorrecto.');
  if(!data.activo)     return aviso('lgMsg','Tu perfil está suspendido. Habla con la organización.');
  iniciarSesion(data);
}

  $('quienSoy').textContent = (et ? et + ' · ' : '') + u.nombre;
  tab = esStaff() ? 'admin' : 'boleta';
  armarTabs(); cargar(); suscribir();
}

async function sesionGuardada(){
  const id = lee('piji_uid');

  const { data } = await sb.from('usuarios').select('*').eq('id', id).maybeSingle();
  if(data && data.activo) iniciarSesion(data);
  else { borra('piji_uid'); pantallaLogin(); }
}

  const visibles = esStaff() ? datos.jornadas : datos.jornadas.filter(j => j.estado !== 'borrador');

    const abierta = visibles.find(j => j.estado === 'abierta');
    jornadaVista = (abierta || visibles[0])?.id || null;
  }
  datos.jornada = datos.jornadas.find(j => j.id === jornadaVista) || null;

  const { data:us } = await sb.from('usuarios').select('id,nombre,whatsapp,rol,activo,avatar,verificado,codigo_verif,saldo,pais');
  datos.usuarios = us || [];

  if(datos.jornada){
    const [p, b] = await Promise.all([
      sb.from('partidos').select('*').eq('jornada_id', jornadaVista).order('orden'),
      sb.from('boletos').select('*').eq('jornada_id', jornadaVista).order('created_at')
    ]);
    datos.partidos = p.data || [];
    datos.boletos  = b.data || [];
    const ids = datos.boletos.map(x => x.id);
    datos.pronosticos = ids.length ? ((await sb.from('pronosticos').select('*').in('boleto_id', ids)).data || []) : [];
    const mio = miBoleto();
    borrador = {};
    if(mio) datos.pronosticos.filter(x => x.boleto_id === mio.id).forEach(x => borrador[x.partido_id] = x.pick);
  } else { datos.partidos = []; datos.boletos = []; datos.pronosticos = []; }

  const mv = await sb.from('movimientos').select('*').eq('usuario_id', yo.id).order('created_at',{ascending:false}).limit(40);
  datos.movimientos = mv.data || [];

  if(modOn('chat')){
    const ms = await sb.from('mensajes').select('*').eq('borrado',false).order('created_at',{ascending:false}).limit(120);
    datos.mensajes = (ms.data || []).reverse();
  }

  if(hayCancha() || esStaff()){
    const tl = await sb.from('tablas_liga').select('*');
    datos.tablas = tl.data || [];
  }

  if(esStaff()){
    const [dp, rt] = await Promise.all([
      sb.from('depositos').select('*').order('created_at',{ascending:false}).limit(60),
      sb.from('retiros').select('*').order('created_at',{ascending:false}).limit(60)
    ]);
    datos.depositos = dp.data || [];
    datos.retiros   = rt.data || [];
  } else {
    const [dp, rt] = await Promise.all([
      sb.from('depositos').select('*').eq('usuario_id', yo.id).order('created_at',{ascending:false}).limit(20),
      sb.from('retiros').select('*').eq('usuario_id', yo.id).order('created_at',{ascending:false}).limit(20)
    ]);
    datos.depositos = dp.data || [];
    datos.retiros   = rt.data || [];
  }
  pintar();
}

const miBoleto  = () => datos.boletos.find(b => b.usuario_id === yo?.id);
const usuarioDe = id => datos.usuarios.find(u => u.id === id) || {};
const nombreDe  = id => usuarioDe(id).nombre || 'Jugador';
const avatarDe  = id => usuarioDe(id).avatar || '⚽';
const waDe      = id => usuarioDe(id).whatsapp || '';
const verifDe   = id => !!usuarioDe(id).verificado;

function puntosDe(boletoId){
  let pts = 0;
  datos.pronosticos.filter(p => p.boleto_id === boletoId).forEach(p => {
    const par = datos.partidos.find(m => m.id === p.partido_id);
    if(par && par.resultado && par.resultado === p.pick) pts++;
  });
  return pts;
}
const bolsa = () => datos.jornada ? datos.boletos.filter(b => b.pagado).length * Number(datos.jornada.costo) : 0;
const listaJornada = () => datos.jornada && datos.partidos.length >= metaDe(datos.jornada);
const visiblePara = j => j && (esStaff() || j.estado !== 'borrador');

function tablaPosiciones(){
  const j = datos.jornada;
  const lista = datos.boletos.map(b => ({ ...b, nombre:nombreDe(b.usuario_id), avatar:avatarDe(b.usuario_id), verif:verifDe(b.usuario_id), puntos:puntosDe(b.id) }))
    .sort((a,b) => b.puntos - a.puntos || new Date(a.created_at) - new Date(b.created_at));
  const total = bolsa(), pcts = [j?.pct1||0, j?.pct2||0, j?.pct3||0];
  let lugar = 0, prev = null, i = 0;
  lista.forEach(f => { i++; if(f.puntos !== prev){ lugar = i; prev = f.puntos; } f.lugar = lugar; });
  lista.forEach(f => {
    const emp = lista.filter(x => x.lugar === f.lugar).length;
    const pct = pcts[f.lugar - 1] || 0;
    f.premio = pct ? (total * pct / 100) / emp : 0;
  });
  return lista;
}

function porLiga(lista){
  const g = [];
  lista.forEach(p => {
    const l = p.liga || 'Otra';
    let b = g.find(x => x.liga === l);
    if(!b){ b = { liga:l, partidos:[] }; g.push(b); }
    b.partidos.push(p);
  });
  g.sort((a,b) => ORDEN_LIGAS.indexOf(a.liga) - ORDEN_LIGAS.indexOf(b.liga));
  return g;
}

/* Conteo animado de las cifras grandes */
function animarCifras(){
  document.querySelectorAll('[data-cuenta]').forEach(el => {
    const fin = Number(el.dataset.cuenta) || 0;
    if(fin <= 0){ el.textContent = dinero(0); return; }
    const ini = performance.now(), dur = 700;
    const paso = t => {
      const k = Math.min(1, (t - ini) / dur);
      el.textContent = dinero(fin * (1 - Math.pow(1 - k, 3)));
      if(k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  });
}

function arrancarReloj(){
  const el = document.querySelector('[data-reloj]');
  if(!el) return;
  const limite = new Date(el.dataset.reloj).getTime();
  const tick = () => {
    const falta = limite - Date.now();
    if(falta <= 0){ el.innerHTML = '<span class="num">REGISTRO CERRADO</span>'; clearInterval(cuenta); return; }
    const d=Math.floor(falta/86400000), h=Math.floor(falta/3600000)%24, m=Math.floor(falta/60000)%60, s=Math.floor(falta/1000)%60;
    el.innerHTML = (d?`<span class="num">${d}</span><span class="etq">d</span>`:'')
      + `<span class="num">${String(h).padStart(2,'0')}</span><span class="etq">h</span>`
      + `<span class="num">${String(m).padStart(2,'0')}</span><span class="etq">m</span>`
      + `<span class="num">${String(s).padStart(2,'0')}</span><span class="etq">s</span>`
      + `<span class="etq">para el cierre</span>`;
  };
  tick(); cuenta = setInterval(tick, 1000);
}

async function guardarBoleta(){
  if(esStaff()) return aviso('bolMsg','Los organizadores no participamos. Si quieres jugar, crea un perfil aparte con otro número.');
  const j = datos.jornada;
  if(new Date(j.fecha_limite) <= new Date()){ await cargar(); return aviso('bolMsg','El registro acaba de cerrar.'); }
  if(!yo.verificado) return aviso('bolMsg','Primero verifica tu WhatsApp.');

  let boleto = miBoleto();

  if(!boleto){
    const costo = Number(j.costo);
    const { data:fresco } = await sb.from('usuarios').select('saldo').eq('id', yo.id).single();
    if(Number(fresco.saldo) < costo) { await cargar(); return aviso('bolMsg','Saldo insuficiente. Deposita para entrar.'); }

    const { data, error } = await sb.from('boletos')
      .insert({ jornada_id:j.id, usuario_id:yo.id, alias:yo.nombre, pagado:true }).select().single();
    if(error) return aviso('bolMsg','No se pudo registrar: ' + error.message);
    boleto = data;

    await sb.from('usuarios').update({ saldo: Number(fresco.saldo) - costo }).eq('id', yo.id);
    await sb.from('movimientos').insert({
      usuario_id:yo.id, tipo:'cargo', monto:-costo,
      concepto:`Boleta ${j.nombre}`, jornada_id:j.id, creado_por:yo.id
    });
  }

  const filas = Object.entries(borrador).map(([partido_id, pick]) => ({ boleto_id:boleto.id, partido_id, pick }));
  const { error } = await sb.from('pronosticos').upsert(filas, { onConflict:'boleto_id,partido_id' });
  if(error) return aviso('bolMsg','No se pudieron guardar los pronósticos: ' + error.message);

  historial = null;
  await cargar();
  aviso('bolMsg','Boleta registrada. Mucha suerte.','ok');
}

function rejillaPronosticos(){
  if(!datos.boletos.length || !datos.partidos.length) return '';
  const lista = tablaPosiciones();
  const ps = datos.partidos;
  const encabezado = ps.map(p => `<th title="${esc(p.local)} vs ${esc(p.visita)}">${p.orden}</th>`).join('');
  const cuerpo = lista.map(f => {
    const celdas = ps.map(p => {
      const pk = datos.pronosticos.find(x => x.boleto_id === f.id && x.partido_id === p.id);
      if(!pk) return `<td><span class="cel">—</span></td>`;
      let cls = 'cel esp';
      if(p.resultado) cls = 'cel ' + (p.resultado === pk.pick ? 'bien' : 'mal');
      return `<td><span class="${cls}">${pk.pick}</span></td>`;
    }).join('');
    return `<tr class="${f.usuario_id===yo.id?'yo':''}">
      <td class="who">${f.avatar} ${esc(f.nombre)}</td>${celdas}<td class="tot">${f.puntos}</td></tr>`;
  }).join('');

  const leyenda = ps.map(p => `${p.orden}. ${esc(p.local)} vs ${esc(p.visita)}`).join(' · ');

  return `<div class="card">
    <div class="card-cab"><h3>Boletas de todos</h3><em>${lista.length} ${lista.length===1?'participante':'participantes'}</em></div>
    <div class="rejilla">
      <table>
        <thead><tr><th class="who">Participante</th>${encabezado}<th>Pts</th></tr></thead>
        <tbody>${cuerpo}</tbody>
      </table>
    </div>
    <div style="padding:12px 16px" class="mini">${leyenda}</div>
  </div>`;
}

function compartirTabla(){
  const j = datos.jornada, lista = tablaPosiciones();
  const jugados = datos.partidos.filter(p => p.resultado).length;
  let t = `*QUINIELAS EL PIJI ACHOTERO*\n${j.nombre}\n`;
  t += `Bolsa: ${dinero(bolsa())} · ${jugados}/${datos.partidos.length} partidos\n\n`;
  lista.slice(0,20).forEach(f => t += `${f.lugar}. ${f.avatar} ${f.nombre} — ${f.puntos} aciertos${f.premio?` · ${dinero(f.premio)}`:''}\n`);
  if(j.estado === 'abierta') t += `\nCierra ${fechaMX(j.fecha_limite)}. Aún puedes entrar.`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

function descargarPDF(){
  const j = datos.jornada;
  if(!j) return;
  const JS = window.jspdf?.jsPDF;
  if(!JS) return alert('No se pudo cargar el generador de PDF. Revisa tu conexión y vuelve a intentar.');

  const doc = new JS({ unit:'pt', format:'letter' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 42;
  const lista = tablaPosiciones();
  const jugados = datos.partidos.filter(p => p.resultado).length;

  const ORO=[212,164,56], TINTA=[18,28,46], GRIS=[110,122,140], LINEA=[214,220,230], VERDE=[18,140,90], ROJO=[176,54,42];

  /* ---- encabezado ---- */
  doc.setFillColor(...TINTA); doc.rect(0,0,W,96,'F');
  doc.setFillColor(14,122,79); doc.rect(0,93,W/2,4,'F');
  doc.setFillColor(29,78,137); doc.rect(W/2,93,W/2,4,'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text('QUINIELAS EL PIJI ACHOTERO', M, 42);
  doc.setTextColor(...ORO); doc.setFontSize(13);
  doc.text(j.nombre.toUpperCase(), M, 64);
  doc.setTextColor(190); doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text(`${datos.partidos.length} partidos · ${jugados} jugados · cierra ${fechaMX(j.fecha_limite)}`, M, 80);

  /* ---- resumen ---- */
  let y = 128;
  const caja = (x, ancho, etq, val) => {
    doc.setDrawColor(...LINEA); doc.setLineWidth(.8);
    doc.roundedRect(x, y, ancho, 54, 6, 6);
    doc.setTextColor(...GRIS); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text(etq.toUpperCase(), x+12, y+18);
    doc.setTextColor(...TINTA); doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text(val, x+12, y+41);
  };
  const an = (W - M*2 - 20) / 3;
  caja(M, an, 'Bolsa acumulada', dinero(bolsa()));
  caja(M+an+10, an, 'Participantes', String(lista.length));
  caja(M+(an+10)*2, an, 'Costo por boleta', dinero(j.costo));
  y += 78;

  /* ---- partidos ---- */
  doc.setTextColor(...TINTA); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('PARTIDOS DE LA JORNADA', M, y); y += 16;
  doc.setFontSize(8.5);
  porLiga(datos.partidos).forEach(g => {
    doc.setTextColor(...ORO); doc.setFont('helvetica','bold');
    doc.text(abrevia(g.liga), M, y); y += 13;
    g.partidos.forEach(p => {
      doc.setTextColor(...TINTA); doc.setFont('helvetica','normal');
      const res = p.resultado ? ({L:'Ganó local',E:'Empate',V:'Ganó visita'})[p.resultado] : 'Por jugar';
      doc.text(`${p.orden}. ${p.local} vs ${p.visita}${p.hora ? '  ·  '+p.hora : ''}`, M+10, y);
      doc.setTextColor(...(p.resultado ? VERDE : GRIS));
      doc.text(res, W-M, y, { align:'right' });
      y += 13;
      if(y > H-120){ doc.addPage(); y = M; }
    });
    y += 4;
  });

  /* ---- tabla de participantes ---- */
  y += 10;
  if(y > H-160){ doc.addPage(); y = M; }
  doc.setTextColor(...TINTA); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('PARTICIPANTES Y ACIERTOS', M, y); y += 18;

  doc.setFillColor(...TINTA); doc.rect(M, y-12, W-M*2, 20, 'F');
  doc.setTextColor(255); doc.setFontSize(8);
  doc.text('#', M+10, y+2);
  doc.text('PARTICIPANTE', M+34, y+2);
  doc.text('ACIERTOS', W-M-140, y+2, { align:'right' });
  doc.text('PREMIO', W-M-10, y+2, { align:'right' });
  y += 20;

  doc.setFontSize(9);
  lista.forEach((f,i) => {
    if(y > H-110){ doc.addPage(); y = M+10; }
    if(i % 2 === 0){ doc.setFillColor(246,248,251); doc.rect(M, y-11, W-M*2, 19, 'F'); }
    doc.setFont('helvetica', f.lugar===1 ? 'bold' : 'normal');
    doc.setTextColor(...(f.lugar===1 ? ORO : GRIS));
    doc.text(String(f.lugar), M+10, y+2);
    doc.setTextColor(...TINTA);
    doc.text(f.nombre.slice(0,38), M+34, y+2);
    doc.text(`${f.puntos} de ${datos.partidos.length}`, W-M-140, y+2, { align:'right' });
    doc.setTextColor(...(f.premio ? VERDE : GRIS));
    doc.text(f.premio ? dinero(f.premio) : '—', W-M-10, y+2, { align:'right' });
    y += 19;
  });

  /* ---- publicidad y pie en todas las páginas ---- */
  const total = doc.internal.getNumberOfPages();
  for(let p = 1; p <= total; p++){
    doc.setPage(p);
    doc.setFillColor(...TINTA); doc.rect(0, H-64, W, 64, 'F');
    doc.setFillColor(...ORO); doc.rect(0, H-64, W, 3, 'F');
    doc.setTextColor(...ORO); doc.setFont('helvetica','bold'); doc.setFontSize(12);
    doc.text(JR31.ing.toUpperCase(), M, H-40);
    doc.setTextColor(235); doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text(`Cotiza tu app al ${JR31.tel} MX`, M, H-25);
    doc.setTextColor(150); doc.setFontSize(7.5);
    doc.text(`${JR31.credito}  ·  ${new Date().toLocaleString('es-MX')}  ·  Página ${p} de ${total}`, W-M, H-12, { align:'right' });
    doc.setTextColor(...ORO); doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text('ING JR31', W-M, H-34, { align:'right' });
  }

  const limpio = j.nombre.replace(/[^\w\sáéíóúñÁÉÍÓÚÑ-]/g,'').replace(/\s+/g,'_');
  doc.save(`Quiniela_Piji_${limpio}.pdf`);
}

function vistaChat(){

  const hora = d => new Date(d).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const hoy = new Date().toDateString();

  const cuerpo = datos.mensajes.length ? datos.mensajes.map(m => {
    const u = usuarioDe(m.usuario_id);
    const mio = m.usuario_id === yo.id;
    const staff = ['admin','organizador'].includes(u.rol);
    const dia = new Date(m.created_at).toDateString();
    return `<div class="msg ${mio?'mio':''} ${staff?'staff':''}">

  }).join('') : '<div class="vacio">Todavía nadie escribe. Rompe el hielo.</div>';

  const conectados = datos.usuarios.filter(u => esJugador(u) && u.verificado && u.activo).length;

  return `
  <div class="card" style="margin-top:16px">
    <div class="card-cab">

}

function alFondoChat(){
  const l = $('chatLista');
  if(l) l.scrollTop = l.scrollHeight;
  $('chTexto')?.focus({preventScroll:true});
}

async function mandarMensaje(){
  const c = $('chTexto'); if(!c) return;
  const texto = c.value.trim();
  if(!texto) return;
  if(texto.length > 400) return;
  c.value = '';
  const { error } = await sb.from('mensajes').insert({ usuario_id:yo.id, texto, jornada_id: datos.jornada?.id || null });
  if(error){ c.value = texto; alert('No se pudo enviar: ' + error.message); }
}

async function borrarMensaje(id){
  if(!esStaff()) return;
  if(!confirm('¿Borrar este mensaje?')) return;
  await sb.from('mensajes').update({ borrado:true }).eq('id', id);
  datos.mensajes = datos.mensajes.filter(m => m.id !== id);
  pintar();
}

function bloqueTablas(){
  if(!datos.tablas.length) return `<div class="card"><div class="vacio">Todavía no hay tablas cargadas.</div></div>`;
  const orden = [...datos.tablas].sort((a,b) => ORDEN_LIGAS.indexOf(a.liga) - ORDEN_LIGAS.indexOf(b.liga));
  return orden.map(t => {
    const filas = (t.datos || []);
    if(!filas.length) return '';
    return `<div class="card">
      <div class="card-cab"><h3>${esc(abrevia(t.liga))}</h3><em>${fechaCorta(t.updated_at)}</em></div>
      <div style="padding:0 16px 8px;overflow-x:auto">
        <table class="tliga">
          <thead><tr><th>#</th><th>Equipo</th><th>JJ</th><th>DIF</th><th>PTS</th></tr></thead>
          <tbody>${filas.map((f,i) => `
            <tr class="${i<8?'zona':''}">
              <td>${i+1}</td><td>${esc(f.equipo)}</td>
              <td>${f.jj ?? '—'}</td><td>${f.dif==null?'—':(f.dif>0?'+'+f.dif:f.dif)}</td>
              <td class="pts">${f.pts ?? '—'}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>
      ${t.nota ? `<div style="padding:0 16px 14px" class="mini">${esc(t.nota)}</div>` : ''}
    </div>`;
  }).join('') || `<div class="card"><div class="vacio">Las tablas están vacías.</div></div>`;
}

function parseTabla(txt){
  const filas = [];
  txt.split('\n').forEach(ln => {
    let l = ln.trim();
    if(!l) return;
    l = l.replace(/^\d+[.)\-]?\s+/, '');           // quita el lugar
    const nums = l.match(/-?\+?\d+/g) || [];
    const equipo = l.replace(/[,;|]/g,' ').replace(/-?\+?\d+/g,'').replace(/\s+/g,' ').trim();
    if(!equipo || equipo.length < 2) return;
    const n = nums.map(x => parseInt(x.replace('+',''),10));
    let jj=null, dif=null, pts=null;
    if(n.length >= 3){ jj=n[0]; dif=n[n.length-2]; pts=n[n.length-1]; }
    else if(n.length === 2){ jj=n[0]; pts=n[1]; }
    else if(n.length === 1){ pts=n[0]; }
    filas.push({ equipo, jj, dif, pts });
  });
  return filas;
}

async function guardarTablaLiga(){
  if(!esStaff()) return;
  const liga = $('tlLiga').value;
  const filas = parseTabla($('tlTexto').value);
  if(filas.length < 2) return aviso('tlMsg','No pude leer la tabla. Pon un equipo por renglón.');
  const { error } = await sb.from('tablas_liga').upsert({
    liga, datos:filas, nota:$('tlNota').value.trim() || null,
    actualizado:yo.id, updated_at:new Date().toISOString()
  }, { onConflict:'liga' });
  if(error) return aviso('tlMsg','No se pudo guardar: ' + error.message);
  await cargar();
  aviso('tlMsg', `Tabla de ${liga} guardada con ${filas.length} equipos.`, 'ok');
}

function cambioMetodo(){
  const mx = $('dpMetodo').value === 'bancoppel';
  $('dpLbl').textContent = mx ? 'Cuánto depositaste en pesos' : 'Cuánto depositaste en dólares';
  $('dpMonto').placeholder = mx ? String(Math.ceil(aMXN(25))) : '25';
  calcDeposito();
}

function calcDeposito(){
  const mx = $('dpMetodo').value === 'bancoppel';
  const v = Number($('dpMonto').value);
  const c = $('dpConv');
  if(!v || !mx){ c.innerHTML = v && !mx ? `Se te acreditan <b>${dinero(v)}</b>.` : ''; return; }
  c.innerHTML = `${pesos(v)} ÷ ${TC()} = se te acreditan <b>${dinero(aUSD(v))}</b> de saldo.`;
}

async function reportarDeposito(){
  const metodo = $('dpMetodo').value;
  const mx = metodo === 'bancoppel';
  const v = Number($('dpMonto').value);
  const ref = $('dpRef').value.trim();
  if(!(v > 0)) return aviso('dpMsg','Escribe cuánto depositaste.');
  if(ref.length < 3) return aviso('dpMsg','Pon una referencia para poder localizar tu depósito.');

  const montoUSD = mx ? aUSD(v) : v;
  if(montoUSD < 1) return aviso('dpMsg','El depósito es demasiado bajo.');

  const { error } = await sb.from('depositos').insert({
    usuario_id:yo.id, monto:montoUSD, monto_origen:v,
    moneda_origen: mx ? 'MXN' : 'USD', tipo_cambio: mx ? TC() : null,
    metodo, referencia:ref, estado:'pendiente'
  });
  if(error) return aviso('dpMsg','No se pudo reportar: ' + error.message);
  $('dpMonto').value=''; $('dpRef').value=''; $('dpConv').innerHTML='';
  await cargar();
  aviso('dpMsg', mx ? `Depósito de ${pesos(v)} reportado. Se acreditarán ${dinero(montoUSD)}.` : 'Depósito reportado. Te avisamos en cuanto se acredite.', 'ok');
}

function calcRetiro(){
  const c = $('rtConv'); if(!c) return;
  const v = Number($('rtMonto').value);
  if(!v || $('rtMetodo').value !== 'bancoppel'){ c.innerHTML = ''; return; }
  c.innerHTML = `${dinero(v)} × ${TC()} = recibes <b>${pesos(aMXN(v))}</b>.`;
}

async function pedirRetiro(){
  const monto = Number($('rtMonto').value);
  const dts = $('rtDatos').value.trim();
  if(!(monto > 0)) return aviso('rtMsg','Escribe cuánto quieres retirar.');
  if(monto > Number(yo.saldo)) return aviso('rtMsg','No puedes retirar más de tu saldo disponible.');
  if(dts.length < 4) return aviso('rtMsg','Pon a dónde te lo mandamos.');
  const met = $('rtMetodo').value;
  const { error } = await sb.from('retiros').insert({
    usuario_id:yo.id, monto, metodo:met,
    datos: met==='bancoppel' ? `BanCoppel · ${dts} · ${pesos(aMXN(monto))}` : `Zelle · ${dts}`,
    estado:'pendiente'
  });
  if(error) return aviso('rtMsg','No se pudo solicitar: ' + error.message);
  $('rtMonto').value=''; $('rtDatos').value='';
  await cargar();
  aviso('rtMsg','Retiro solicitado.','ok');
}

async function cargarHistorial(){
  const ids = datos.jornadas.map(j => j.id);
  if(!ids.length){ historial = { jornadas:[], jugadas:0, aciertos:0, ganadas:0, premio:0 }; return pintar(); }
  const [bt, pt] = await Promise.all([
    sb.from('boletos').select('*').in('jornada_id', ids),
    sb.from('partidos').select('id,jornada_id,resultado').in('jornada_id', ids)
  ]);
  const boletos = bt.data || [], partidos = pt.data || [];
  const pr = boletos.length ? ((await sb.from('pronosticos').select('*').in('boleto_id', boletos.map(b=>b.id))).data || []) : [];

  const resumen = [];
  datos.jornadas.forEach(j => {
    const bs = boletos.filter(b => b.jornada_id === j.id);
    const ps = partidos.filter(p => p.jornada_id === j.id);
    const conRes = ps.filter(p => p.resultado).length;
    const marcados = bs.map(b => {
      let a = 0;
      pr.filter(x => x.boleto_id === b.id).forEach(x => {
        const par = ps.find(m => m.id === x.partido_id);
        if(par && par.resultado === x.pick) a++;
      });
      return { ...b, aciertos:a };
    }).sort((x,y) => y.aciertos - x.aciertos);
    const mio = marcados.find(b => b.usuario_id === yo.id);
    if(!mio) return;
    const mejor = marcados[0]?.aciertos ?? 0;
    const emp = marcados.filter(b => b.aciertos === mejor).length;
    const pag = marcados.filter(b => b.pagado).length;
    const gane = j.estado === 'finalizada' && mio.aciertos === mejor && conRes > 0;
    resumen.push({ jornada:j, aciertos:mio.aciertos, jugados:conRes, gane,
      premio: gane ? (pag * Number(j.costo) * (j.pct1/100)) / emp : 0 });
  });

  historial = { jornadas:resumen, jugadas:resumen.length,
    aciertos:resumen.reduce((s,r)=>s+r.aciertos,0),
    ganadas:resumen.filter(r=>r.gane).length,
    premio:resumen.reduce((s,r)=>s+r.premio,0) };
  pintar();
}

async function guardarPerfil(){
  const nombre = $('pfNombre').value.trim();
  if(nombre.length < 3) return aviso('pfMsg','El nombre necesita al menos 3 letras.');
  const { error } = await sb.from('usuarios').update({ nombre, avatar:yo.avatar }).eq('id', yo.id);
  if(error) return aviso('pfMsg','No se pudo guardar: ' + error.message);
  yo.nombre = nombre;
  const et = tituloRol(yo.rol);
  $('quienSoy').textContent = (et ? et + ' · ' : '') + nombre;
  historial = null; await cargar(); await cargarHistorial();
  aviso('pfMsg','Perfil actualizado.','ok');
}

async function cambiarPin(){
  const viejo = $('pnViejo').value.trim(), nuevo = $('pnNuevo').value.trim();
  if(viejo !== yo.pin)   return aviso('pnMsg','Tu PIN actual no coincide.');
  if(!/^\d{4}$/.test(nuevo)) return aviso('pnMsg','El PIN nuevo debe tener 4 dígitos.');
  const { error } = await sb.from('usuarios').update({ pin:nuevo }).eq('id', yo.id);
  if(error) return aviso('pnMsg','No se pudo cambiar: ' + error.message);
  yo.pin = nuevo; $('pnViejo').value=''; $('pnNuevo').value='';
  aviso('pnMsg','PIN cambiado.','ok');
}

      <datalist id="listaHoras">
        <option>Sáb 12:00</option><option>Sáb 17:00</option><option>Sáb 19:00</option><option>Sáb 21:00</option>
        <option>Dom 12:00</option><option>Dom 17:00</option><option>Dom 19:00</option><option>Dom 21:00</option>
      </datalist>
      <button class="btn" onclick="agregarPartido()">Agregar partido</button>
      <div id="apMsg"></div>
    </div></div>

    ${n ? `<div class="card">
      <div class="card-cab"><h3>Partidos y resultados</h3><em>toca L · E · V</em></div>
      ${listaPartidos}
    </div>` : ''}

    ${j.estado === 'borrador' ? `
      <button class="btn" onclick="publicarJornada()" ${n < meta ? 'disabled' : ''}>
        ${n < meta ? `Faltan ${meta-n} partidos para publicar` : 'Publicar jornada y avisar'}
      </button>
      <button class="btn fantasma" onclick="cambiarTotal()">Cambiar total de partidos (${meta})</button>
      <p class="mini">Mientras esté en borrador, nadie más la ve. Al publicarla se abre el registro y se prepara el aviso para todos.</p>
    ` : `
      <div class="${esDueno()?'fila2':''}" style="margin-top:14px">
        <button class="btn fantasma" onclick="cambiarEstado('${j.estado==='abierta'?'cerrada':'abierta'}')">
          ${j.estado==='abierta'?'Cerrar registro':'Reabrir registro'}
        </button>
        ${esDueno() ? `<button class="btn" onclick="finalizarJornada()" ${j.premios_pagados?'disabled':''}>${j.premios_pagados?'Premios pagados':'Finalizar y pagar'}</button>` : ''}
      </div>
      ${!esDueno() ? `<p class="mini">El cierre final y el pago de premios los maneja Jared.</p>` : ''}
      <button class="btn fantasma" onclick="avisarTodos()">Avisar a los participantes</button>
      <button class="btn fantasma" onclick="descargarPDF()">Descargar PDF de la jornada</button>
    `}

    <div class="card">
      <div class="card-cab"><h3>Boletas de esta jornada</h3></div>
      ${boletos}
    </div>
  </div>`;
}

function cambiarLiga(l){ ligaSel = l; refrescarEquipos(); $('apLocal')?.focus(); }
function refrescarEquipos(){
  const dl = $('listaEquipos'); if(!dl) return;
  dl.innerHTML = (LIGAS[ligaSel] || []).map(e => `<option value="${esc(e)}"></option>`).join('');
}

async function crearJornada(){
  const nombre = $('njNombre').value.trim(), costo = Number($('njCosto').value), limite = $('njLimite').value;
  if(nombre.length < 3) return aviso('njMsg','Ponle nombre a la jornada.');
  if(!limite)           return aviso('njMsg','Falta la fecha de cierre.');
  const { data, error } = await sb.from('jornadas').insert({
    nombre, costo, moneda:'USD', fecha_limite:new Date(limite).toISOString(),
    total_partidos:Number($('njTotal').value)||10, estado:'borrador',
    pct1:Number($('njP1').value)||0, pct2:Number($('njP2').value)||0, pct3:Number($('njP3').value)||0
  }).select().single();
  if(error) return aviso('njMsg','No se pudo crear: ' + error.message);
  jornadaVista = data.id; historial = null; await cargar();
}

async function agregarPartido(){
  const local = $('apLocal').value.trim(), visita = $('apVisita').value.trim();
  if(!local || !visita) return aviso('apMsg','Faltan los dos equipos.');
  if(local.toLowerCase() === visita.toLowerCase()) return aviso('apMsg','Un equipo no juega contra sí mismo.');
  const meta = metaDe(datos.jornada);
  if(datos.partidos.length >= meta) return aviso('apMsg',`Ya tienes los ${meta} partidos de esta jornada. Quita uno si quieres cambiarlo, o sube el total desde Cambiar total.`);
  const { error } = await sb.from('partidos').insert({
    jornada_id: datos.jornada.id, orden: datos.partidos.length + 1,
    liga: ligaSel, local, visita, hora: $('apHora').value.trim() || null
  });
  if(error) return aviso('apMsg','No se pudo agregar: ' + error.message);
  $('apLocal').value=''; $('apVisita').value='';
  await cargar(); $('apLocal')?.focus();
}

async function quitarPartido(id){
  if(!confirm('¿Quitar este partido? Se borran también los pronósticos de ese partido.')) return;
  await sb.from('partidos').delete().eq('id', id);
  const rest = datos.partidos.filter(p => p.id !== id);
  for(let i=0;i<rest.length;i++) if(rest[i].orden !== i+1) await sb.from('partidos').update({orden:i+1}).eq('id',rest[i].id);
  await cargar();
}

async function ponerResultado(id, v){
  const actual = datos.partidos.find(p => p.id === id)?.resultado;
  await sb.from('partidos').update({ resultado: actual === v ? null : v }).eq('id', id);
  historial = null; await cargar();
}

async function cambiarEstado(estado){
  await sb.from('jornadas').update({ estado }).eq('id', datos.jornada.id);
  historial = null; await cargar();
}

async function finalizarJornada(){
  if(!esDueno()) return;
  const j = datos.jornada;
  if(j.premios_pagados) return alert('Los premios de esta jornada ya se pagaron.');
  const lista = tablaPosiciones().filter(f => f.premio > 0);
  if(!lista.length) return alert('Todavía no hay premios que repartir. Captura los resultados primero.');
  const resumen = lista.map(f => `${f.nombre}: ${dinero(f.premio)}`).join('\n');
  if(!confirm(`Se van a abonar estos premios a los monederos:\n\n${resumen}\n\n¿Confirmas?`)) return;

  for(const f of lista){
    const { data:u } = await sb.from('usuarios').select('saldo').eq('id', f.usuario_id).single();
    await sb.from('usuarios').update({ saldo: Number(u.saldo) + f.premio }).eq('id', f.usuario_id);
    await sb.from('movimientos').insert({
      usuario_id:f.usuario_id, tipo:'premio', monto:f.premio,
      concepto:`Premio ${j.nombre} · ${f.lugar}º lugar`, jornada_id:j.id, creado_por:yo.id
    });
  }
  await sb.from('jornadas').update({ estado:'finalizada', premios_pagados:true }).eq('id', j.id);
  historial = null; await cargar();
  alert('Premios abonados.');
}

async function resolverDeposito(id, aprobar){
  if(!esDueno()) return;
  const d = datos.depositos.find(x => x.id === id); if(!d) return;
  if(aprobar){
    const { data:u } = await sb.from('usuarios').select('saldo').eq('id', d.usuario_id).single();
    await sb.from('usuarios').update({ saldo: Number(u.saldo) + Number(d.monto) }).eq('id', d.usuario_id);
    await sb.from('movimientos').insert({
      usuario_id:d.usuario_id, tipo:'deposito', monto:Number(d.monto),
      concepto:`Depósito por ${d.metodo}`, creado_por:yo.id
    });
    await sb.from('depositos').update({ estado:'aprobado', revisado_por:yo.id }).eq('id', id);
  } else {
    const nota = prompt('Motivo del rechazo (lo va a ver el participante):') || 'No se localizó el depósito';
    await sb.from('depositos').update({ estado:'rechazado', nota, revisado_por:yo.id }).eq('id', id);
  }
  await cargar();
}

async function resolverRetiro(id, pagado){
  if(!esDueno()) return;
  const r = datos.retiros.find(x => x.id === id); if(!r) return;
  if(pagado){
    const { data:u } = await sb.from('usuarios').select('saldo').eq('id', r.usuario_id).single();
    if(Number(u.saldo) < Number(r.monto)) return alert('El participante ya no tiene ese saldo.');
    await sb.from('usuarios').update({ saldo: Number(u.saldo) - Number(r.monto) }).eq('id', r.usuario_id);
    await sb.from('movimientos').insert({
      usuario_id:r.usuario_id, tipo:'retiro', monto:-Number(r.monto), concepto:'Retiro pagado', creado_por:yo.id
    });
    await sb.from('retiros').update({ estado:'pagado', revisado_por:yo.id }).eq('id', id);
  } else {
    await sb.from('retiros').update({ estado:'rechazado', revisado_por:yo.id }).eq('id', id);
  }
  await cargar();
}

async function ajustarSaldo(id, nombre){
  if(!esDueno()) return;
  const txt = prompt(`Ajuste de saldo para ${nombre}.\nPon un número positivo para abonar o negativo para descontar:`);
  if(txt === null) return;
  const monto = Number(txt);
  if(!monto) return;
  const concepto = prompt('Concepto del ajuste:') || 'Ajuste manual';
  const { data:u } = await sb.from('usuarios').select('saldo').eq('id', id).single();
  await sb.from('usuarios').update({ saldo: Number(u.saldo) + monto }).eq('id', id);
  await sb.from('movimientos').insert({ usuario_id:id, tipo:'ajuste', monto, concepto, creado_por:yo.id });
  await cargar();
}

async function verificarJugador(id, aprobar){
  if(aprobar){
    await sb.from('usuarios').update({ verificado:true }).eq('id', id);
  } else {
    if(!confirm('¿Borrar este perfil? Se va junto con sus boletas y su saldo.')) return;
    await sb.from('usuarios').delete().eq('id', id);
  }
  await cargar();
}

async function alternarJugador(id, activo){
  await sb.from('usuarios').update({ activo: !activo }).eq('id', id);
  await cargar();
}

async function resetPin(id, nombre){
  if(!esDueno()) return;
  const nuevo = prompt(`PIN nuevo de 4 dígitos para ${nombre}:`);
  if(nuevo === null) return;
  if(!/^\d{4}$/.test(nuevo)) return alert('Tienen que ser 4 dígitos.');
  const { error } = await sb.from('usuarios').update({ pin:nuevo }).eq('id', id);
  alert(error ? 'No se pudo: ' + error.message : `Listo. El PIN de ${nombre} ahora es ${nuevo}.`);
}

async function guardarCobro(){
  if(!esDueno()) return;
  const tc = Number($('cfTC').value);
  if(!(tc > 0)) return aviso('cfMsg','El tipo de cambio tiene que ser mayor a cero.');
  const pares = {
    whatsapp_org:  soloD($('cfWa').value),
    tipo_cambio:   String(tc),
    zelle_nombre:  $('cfZn').value.trim(),
    zelle_email:   $('cfZe').value.trim(),
    coppel_titular:$('cfCt').value.trim(),
    coppel_tarjeta:soloD($('cfCn').value),
    coppel_clabe:  soloD($('cfCc').value)
  };
  for(const [clave, valor] of Object.entries(pares)){
    await sb.from('config').upsert({ clave, valor }, { onConflict:'clave' });
  }
  await cargar();
  aviso('cfMsg','Datos de cobro guardados.','ok');
}

async function guardarTerminos(){
  if(!esDueno()) return;
  const valor = $('cfTerm').value.trim();
  if(valor.length < 50) return aviso('ctMsg','El texto quedó muy corto.');
  await sb.from('config').upsert({ clave:'terminos', valor }, { onConflict:'clave' });
  await cargar();
  aviso('ctMsg','Cláusulas guardadas.','ok');
}

async function cambiarTotal(){
  if(!esStaff()) return;
  const t = prompt('¿Cuántos partidos va a llevar esta jornada?', metaDe(datos.jornada));
  if(t === null) return;
  const n = parseInt(t, 10);
  if(!(n >= 1 && n <= 20)) return alert('Pon un número entre 1 y 20.');
  if(n < datos.partidos.length) return alert(`Ya tienes ${datos.partidos.length} partidos cargados. Quita los que sobren primero.`);
  await sb.from('jornadas').update({ total_partidos:n }).eq('id', datos.jornada.id);
  await cargar();
}

async function publicarJornada(){
  if(!esStaff()) return;
  const j = datos.jornada, meta = metaDe(j);
  if(datos.partidos.length < meta) return alert(`Faltan partidos. Llevas ${datos.partidos.length} de ${meta}.`);
  if(new Date(j.fecha_limite) <= new Date()) return alert('La hora de cierre ya pasó. Cámbiala antes de publicar.');
  if(!confirm(`¿Publicar "${j.nombre}"?\n\n${meta} partidos · ${dinero(j.costo)} la boleta.\nEn cuanto la publiques, todos los participantes la pueden llenar.`)) return;
  await sb.from('jornadas').update({ estado:'abierta', publicada_en:new Date().toISOString() }).eq('id', j.id);
  await cargar();
  avisarTodos();
}

function textoAviso(){
  const j = datos.jornada;
  let t = `*QUINIELAS EL PIJI ACHOTERO*\n_Ya salió la ${j.nombre}_\n\n`;
  t += `${datos.partidos.length} partidos · ${dinero(j.costo)} la boleta\n`;
  t += `Cierra: ${fechaMX(j.fecha_limite)}\nGana quien más aciertos junte.\n\n`;
  porLiga(datos.partidos).forEach(g => {
    t += `_${abrevia(g.liga)}_\n`;
    g.partidos.forEach(p => t += `${p.orden}. ${p.local} vs ${p.visita}${p.hora?' · '+p.hora:''}\n`);
    t += `\n`;
  });
  t += `Llena tu boleta aquí:\n${location.origin}`;
  return t;
}

function avisarTodos(){
  const jugadores = datos.usuarios.filter(u => esJugador(u) && u.verificado && u.activo);
  avisoJornada = { texto: textoAviso(), jugadores };
  tab = 'admin'; armarTabs(); pintar();
  setTimeout(() => document.getElementById('cajaAviso')?.scrollIntoView({behavior:'smooth',block:'center'}), 60);
}

async function copiarAviso(){
  try{
    await navigator.clipboard.writeText(avisoJornada.texto);
    aviso('avMsg','Aviso copiado. Pégalo en el grupo de WhatsApp.','ok');
  }catch(e){
    aviso('avMsg','No se pudo copiar solo. Selecciona el texto de arriba y cópialo a mano.');
  }
}

function convocar(){
  const j = datos.jornada;
  let t = `*QUINIELAS EL PIJI ACHOTERO*\n${j.nombre}\n\n`;
  t += `Costo: ${dinero(j.costo)} ${j.moneda}\nCierra: ${fechaMX(j.fecha_limite)}\nBolsa actual: ${dinero(bolsa())}\nGana quien más aciertos junte.\n\n`;
  porLiga(datos.partidos).forEach(g => {
    t += `_${abrevia(g.liga)}_\n`;
    g.partidos.forEach(p => t += `${p.orden}. ${p.local} vs ${p.visita}${p.hora?' · '+p.hora:''}\n`);
    t += `\n`;
  });
  t += `Crea tu perfil y llena tu boleta: ${location.origin}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

/* ---------- Arranque ---------- */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const id = document.activeElement?.id;
  if(['lgWa','lgPin'].includes(id)) entrar();
  else if(['rgNombre','rgWa','rgPin'].includes(id)) registrar();
  else if(['apVisita','apHora'].includes(id)) agregarPartido();
});
sesionGuardada();
</script>
</body>
</html>
