<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quinielas El Piji Achotero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  /* base: azul noche para que el contenido se lea sobre las banderas */
  --cancha:#132539; --cancha-2:#0A1626; --raya:#20385A;
  --cal:#F5F3EE; --cal-suave:rgba(245,243,238,.60); --cal-tenue:rgba(245,243,238,.20);
  --ambar:#E8B33C; --ambar-hondo:#A97C16;
  --roja:#CE1126; --verde:#007A4D;
  --verde-mx:#006847; --rojo-mx:#CE1126;
  --azul-us:#0A3161; --rojo-us:#B31942;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--cancha-2);
  color:var(--cal);
  font:400 16px/1.5 'Barlow',system-ui,sans-serif;
  min-height:100vh;padding-bottom:64px;position:relative;overflow-x:hidden;
}

/* ============ FONDO: MÉXICO A LA IZQUIERDA, USA A LA DERECHA ============ */
body::before,body::after{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
}
/* México: bandas verticales verde, blanco, rojo */
body::before{
  background:linear-gradient(90deg,
    var(--verde-mx) 0 33.3%, #FFFFFF 33.3% 66.6%, var(--rojo-mx) 66.6% 100%);
  clip-path:polygon(0 0, 58% 0, 42% 100%, 0 100%);
  opacity:.30;
}
/* Estados Unidos: barras + cantón azul con estrellas */
body::after{
  background:
    radial-gradient(circle at 12px 12px, #FFF 1.6px, transparent 1.8px) 0 0/34px 34px,
    linear-gradient(var(--azul-us),var(--azul-us)) 0 0/56% 46% no-repeat,
    repeating-linear-gradient(180deg, var(--rojo-us) 0 7.7%, #FFFFFF 7.7% 15.4%);
  background-blend-mode:screen,normal,normal;
  clip-path:polygon(58% 0, 100% 0, 100% 100%, 42% 100%);
  opacity:.30;
}
/* velo oscuro para que todo se lea */
.velo{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,22,38,.80) 0%,rgba(10,22,38,.90) 40%,rgba(10,22,38,.95) 100%)}

.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.hide{display:none !important}
h1,h2,h3{font-family:'Barlow Condensed','Barlow',sans-serif;letter-spacing:.01em;line-height:1.05}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--ambar)}

/* ============ BARRA ============ */
.barra{
  background:rgba(19,37,57,.94);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--raya);
}
.barra::after{
  content:'';display:block;height:4px;
  background:linear-gradient(90deg,
    var(--verde-mx) 0 20%, #FFF 20% 27%, var(--rojo-mx) 27% 47%,
    var(--azul-us) 47% 60%, var(--rojo-us) 60% 73%, #FFF 73% 86%, var(--rojo-us) 86% 100%);
}
.barra-in{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:640px;margin:0 auto}
.escudo{
  width:42px;height:42px;flex:0 0 42px;border-radius:50%;
  background:linear-gradient(140deg,var(--verde-mx) 0 50%, var(--azul-us) 50% 100%);
  border:2px solid var(--ambar);color:#FFF;
  display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:700;font-size:19px;
  box-shadow:0 0 0 3px rgba(232,179,60,.18);
}
.barra h1{font-size:20px;font-weight:700;text-transform:uppercase}
.barra small{display:block;font-size:11px;color:var(--cal-suave);letter-spacing:.08em;text-transform:uppercase;font-family:'Barlow'}
.salir{margin-left:auto;font-size:13px;color:var(--cal-suave);border-bottom:1px solid var(--cal-tenue);padding-bottom:1px}

/* ============ TABS estilo pastilla ============ */
.tabs{background:rgba(19,37,57,.94);backdrop-filter:blur(8px);position:sticky;top:0;z-index:39;padding:8px 0;border-bottom:1px solid var(--raya)}
.tabs-in{display:flex;gap:6px;max-width:640px;margin:0 auto;width:100%;padding:0 12px}
.tab{
  flex:1;padding:10px 4px;border-radius:999px;
  font-family:'Barlow Condensed';font-size:16px;font-weight:600;text-transform:uppercase;
  color:var(--cal-suave);border:1.5px solid transparent;transition:all .15s;
}
.tab.on{
  color:#241703;border-color:var(--ambar-hondo);
  background:linear-gradient(180deg,#F5C960,var(--ambar));
  box-shadow:0 3px 0 var(--ambar-hondo);
}

/* ============ MARCADOR ============ */
.marcador{background:rgba(19,37,57,.92);border:1px solid var(--raya);border-radius:var(--r);margin-top:16px;overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.marcador-top{padding:16px 18px 14px;border-bottom:1px dashed var(--raya);position:relative}
.marcador-top::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--verde-mx) 0 50%,var(--azul-us) 50% 100%)}
.marcador-top h2{font-size:26px;font-weight:700;text-transform:uppercase;padding-left:8px}
.marcador-top p{font-size:13px;color:var(--cal-suave);margin-top:3px;padding-left:8px}
.reloj{display:flex;gap:10px;padding:14px 18px;align-items:baseline;flex-wrap:wrap}
.reloj .num{font-family:'Barlow Condensed';font-size:40px;font-weight:700;color:var(--ambar);line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.reloj .etq{font-size:12px;color:var(--cal-suave);letter-spacing:.06em}
.bolsa{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;
  background:linear-gradient(90deg,rgba(0,104,71,.22),rgba(10,49,97,.22));border-top:1px solid var(--raya)}
.bolsa b{font-family:'Barlow Condensed';font-size:32px;font-weight:700;color:var(--ambar)}
.bolsa span{font-size:13px;color:var(--cal-suave)}

/* ============ BOLETA ============ */
.boleta{margin-top:18px;border:1px solid var(--raya);border-radius:var(--r);background:rgba(19,37,57,.92);overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.boleta-cab{padding:12px 16px;background:linear-gradient(90deg,var(--verde-mx),var(--azul-us));display:flex;justify-content:space-between;align-items:center}
.boleta-cab h3{font-size:17px;text-transform:uppercase;font-weight:700}
.boleta-cab em{font-style:normal;font-size:13px;color:rgba(255,255,255,.75)}
.grupo{padding:8px 16px;background:rgba(232,179,60,.10);border-bottom:1px solid var(--raya);
  font-family:'Barlow Condensed';font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--ambar);text-transform:uppercase}
.filap{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px;border-bottom:1px solid var(--raya);align-items:center}
.filap:last-child{border-bottom:none}
.equipos{min-width:0}
.equipos .l,.equipos .v{font-weight:600;font-size:15px}
.equipos .vs{font-size:11px;color:var(--cal-suave);letter-spacing:.14em;margin:2px 0}
.equipos .hr{font-size:12px;color:var(--cal-suave);margin-top:4px}
.equipos .num-p{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;
  background:var(--raya);font-family:'Barlow Condensed';font-size:12px;color:var(--ambar);font-weight:700;margin-right:7px}

/* ---- botones L / E / V con relieve ---- */
.picks{display:flex;gap:7px}
.pick{
  width:46px;height:46px;border-radius:10px;
  border:1.5px solid var(--raya);background:rgba(255,255,255,.04);
  font-family:'Barlow Condensed';font-size:20px;font-weight:700;color:var(--cal-suave);
  display:grid;place-items:center;transition:transform .08s,box-shadow .08s,background .15s;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.pick:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.35)}
.pick:disabled{opacity:.45;cursor:default;box-shadow:none}
.pick.sel{color:#FFF;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pick.sel:nth-child(1){background:linear-gradient(180deg,#00905F,var(--verde-mx));box-shadow:0 3px 0 #004E35}
.pick.sel:nth-child(2){background:linear-gradient(180deg,#F5C960,var(--ambar));color:#241703;box-shadow:0 3px 0 var(--ambar-hondo);text-shadow:none}
.pick.sel:nth-child(3){background:linear-gradient(180deg,#154A8C,var(--azul-us));box-shadow:0 3px 0 #06203F}
.pick.acierto{outline:2.5px solid #2ECC71;outline-offset:2px}
.pick.fallo{outline:2.5px solid var(--rojo-us);outline-offset:2px}
.res-chip{font-size:11px;color:var(--ambar);margin-top:5px;letter-spacing:.06em;font-weight:600}

/* ============ BOTONES ============ */
.btn{
  display:block;width:100%;padding:15px;border-radius:var(--r);
  background:linear-gradient(180deg,#F5C960,var(--ambar));color:#241703;
  font-family:'Barlow Condensed';font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  margin-top:14px;box-shadow:0 4px 0 var(--ambar-hondo);transition:transform .08s,box-shadow .08s;
}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ambar-hondo)}
.btn:disabled{background:var(--raya);color:var(--cal-suave);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn.fantasma{background:rgba(255,255,255,.05);border:1.5px solid var(--raya);color:var(--cal);box-shadow:0 4px 0 rgba(0,0,0,.32)}
.btn.chico{width:auto;padding:9px 16px;font-size:15px;margin-top:0;box-shadow:0 3px 0 var(--ambar-hondo)}
.btn.chico.fantasma{box-shadow:0 3px 0 rgba(0,0,0,.32)}
.btn.roja{background:linear-gradient(180deg,#E0344A,var(--rojo-us));color:#FFF;box-shadow:0 4px 0 #7C1129}

/* ============ TABLA ============ */
.tabla{margin-top:16px;border:1px solid var(--raya);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.tabla-cab{padding:12px 16px;background:linear-gradient(90deg,var(--verde-mx),var(--azul-us));
  font-family:'Barlow Condensed';font-size:17px;font-weight:700;text-transform:uppercase}
.pos{display:grid;grid-template-columns:30px 34px 1fr auto auto;gap:9px;padding:12px 16px;align-items:center;
  border-bottom:1px solid var(--raya);background:rgba(19,37,57,.92)}
.pos:last-child{border-bottom:none}
.pos .lug{font-family:'Barlow Condensed';font-size:21px;font-weight:700;color:var(--cal-suave);text-align:center}
.pos.p1{background:linear-gradient(90deg,rgba(232,179,60,.16),rgba(19,37,57,.92))}
.pos.p1 .lug{color:var(--ambar);font-size:25px}
.pos .av{font-size:23px;line-height:1;text-align:center}
.pos .nom{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .nom small{display:block;font-weight:400;font-size:12px;color:var(--cal-suave)}
.pos .pts{font-family:'Barlow Condensed';font-size:25px;font-weight:700}
.pos .prem{font-size:13px;color:var(--ambar);font-weight:700}
.deuda{font-size:11px;color:#FF7A66;font-weight:600;letter-spacing:.04em}

/* ============ FORMULARIOS ============ */
.campo{margin-top:14px}
.campo label{display:block;font-size:13px;color:var(--cal-suave);margin-bottom:6px}
.campo input,.campo select{width:100%;padding:13px 14px;border-radius:10px;background:rgba(10,22,38,.75);
  border:1.5px solid var(--raya);color:var(--cal)}
.campo input:focus,.campo select:focus{outline:2px solid var(--ambar);border-color:transparent}
.campo input::placeholder{color:rgba(245,243,238,.32)}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fila3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ============ ENTRADA ============ */
.entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.entrada-caja{width:100%;max-width:410px}
.logo-grande{text-align:center;margin-bottom:26px}
.logo-grande .balon{
  width:92px;height:92px;margin:0 auto 16px;border-radius:50%;
  background:linear-gradient(140deg,var(--verde-mx) 0 50%,var(--azul-us) 50% 100%);
  border:3px solid var(--ambar);color:#FFF;display:grid;place-items:center;
  font-family:'Barlow Condensed';font-size:38px;font-weight:700;
  box-shadow:0 0 0 6px rgba(232,179,60,.14), 0 10px 30px rgba(0,0,0,.45);
}
.logo-grande h1{font-size:38px;font-weight:700;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.logo-grande p{font-size:12px;color:var(--ambar);margin-top:8px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.banderines{display:flex;justify-content:center;gap:8px;font-size:20px;margin-top:10px}
.cambio{text-align:center;margin-top:18px;font-size:14px;color:var(--cal-suave)}
.cambio button{color:var(--ambar);font-weight:600;text-decoration:underline}

/* ============ VARIOS ============ */
.vacio{text-align:center;padding:44px 20px;color:var(--cal-suave);font-size:15px}
.aviso{padding:12px 14px;border-radius:10px;font-size:14px;margin-top:14px;border-left:4px solid}
.aviso.err{background:rgba(206,17,38,.16);border-color:var(--rojo-us)}
.aviso.ok{background:rgba(0,122,77,.18);border-color:var(--verde)}
.aviso.info{background:rgba(232,179,60,.13);border-color:var(--ambar)}
.seccion{margin-top:26px}
.seccion > h3{font-family:'Barlow Condensed';font-size:21px;font-weight:700;text-transform:uppercase;margin-bottom:2px}
.seccion > p{font-size:13px;color:var(--cal-suave)}
.tarjeta{background:rgba(19,37,57,.92);border:1px solid var(--raya);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:0 8px 26px rgba(0,0,0,.3)}
.jrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--raya);background:rgba(19,37,57,.92)}
.jrow:last-child{border-bottom:none}
.jrow .t{font-weight:600;font-size:15px}
.jrow .s{font-size:12px;color:var(--cal-suave);margin-top:2px}
.etiqueta{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.etiqueta.abierta{background:rgba(0,122,77,.24);color:#5EE0A0}
.etiqueta.cerrada{background:rgba(232,179,60,.20);color:var(--ambar)}
.etiqueta.finalizada{background:var(--raya);color:var(--cal-suave)}
.cargando{text-align:center;padding:50px;color:var(--cal-suave)}
.switch{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--ambar)}
.mini{font-size:12px;color:var(--cal-suave);margin-top:8px;line-height:1.45}

.progreso{display:flex;align-items:center;gap:12px;margin-top:12px}
.progreso .cifra{font-family:'Barlow Condensed';font-size:32px;font-weight:700;color:var(--ambar);line-height:1}
.progreso .txt{font-size:13px;color:var(--cal-suave)}
.barritas{display:flex;gap:3px;margin-top:8px}
.barrita{height:7px;flex:1;border-radius:4px;background:var(--raya)}
.barrita.on{background:var(--azul-us)}
.barrita.mx{background:var(--verde-mx)}

/* ============ PERFIL: credencial ============ */
.perfil-cab{
  margin-top:16px;border-radius:var(--r);overflow:hidden;border:1px solid var(--raya);
  background:rgba(19,37,57,.92);box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.perfil-tira{height:8px;background:linear-gradient(90deg,
  var(--verde-mx) 0 16%, #FFF 16% 25%, var(--rojo-mx) 25% 42%,
  var(--azul-us) 50% 62%, var(--rojo-us) 62% 74%, #FFF 74% 86%, var(--rojo-us) 86% 100%)}
.perfil-cuerpo{display:flex;align-items:center;gap:16px;padding:20px 18px}
.perfil-av{
  width:76px;height:76px;flex:0 0 76px;border-radius:50%;
  background:linear-gradient(140deg,var(--verde-mx) 0 50%,var(--azul-us) 50% 100%);
  display:grid;place-items:center;font-size:36px;border:3px solid var(--ambar);
  box-shadow:0 0 0 5px rgba(232,179,60,.15);
}
.perfil-cuerpo h2{font-size:28px;font-weight:700}
.perfil-cuerpo p{font-size:13px;color:var(--cal-suave);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:rgba(19,37,57,.92);border:1px solid var(--raya);border-radius:var(--r);padding:15px 10px;text-align:center;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--ambar)}
.stat b{display:block;font-family:'Barlow Condensed';font-size:32px;font-weight:700;color:var(--ambar);line-height:1}
.stat span{display:block;font-size:11px;color:var(--cal-suave);margin-top:6px;letter-spacing:.04em}
.avatares{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.av-op{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--raya);background:rgba(255,255,255,.04);
  font-size:25px;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s}
.av-op:active{transform:translateY(3px);box-shadow:none}
.av-op.sel{border-color:var(--ambar);background:linear-gradient(180deg,rgba(232,179,60,.28),rgba(232,179,60,.12));box-shadow:0 3px 0 var(--ambar-hondo)}

/* ============ VERIFICACIÓN ============ */
.ver-caja{text-align:center;padding:26px 20px}
.ver-caja .cod{font-family:'Barlow Condensed';font-size:56px;font-weight:700;color:var(--ambar);
  letter-spacing:.18em;line-height:1;margin:14px 0;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.lada{display:grid;grid-template-columns:120px 1fr;gap:10px}
.chip-ver{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:rgba(0,122,77,.26);color:#5EE0A0;margin-left:6px}
.chip-no{font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:999px;background:rgba(206,17,38,.24);color:#FF8A78;margin-left:6px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="velo"></div>

<!-- ==================== ENTRADA ==================== -->
<div id="entrada" class="entrada">
  <div class="entrada-caja">
    <div class="logo-grande">
      <div class="balon">PA</div>
      <h1>Quinielas<br>El Piji Achotero</h1>
      <p>10 partidos · gana el que más acierte</p>
      <div class="banderines">🇲🇽 ⚽ 🇺🇸</div>
    </div>

    <div id="formLogin">
      <div class="campo"><label for="lgWa">WhatsApp o usuario</label>
        <input id="lgWa" autocomplete="username" placeholder="9181234567"></div>
      <div class="campo"><label for="lgPin">PIN</label>
        <input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>
      <button class="btn" onclick="entrar()">Entrar</button>
      <div id="lgMsg"></div>
      <p class="cambio">¿Primera vez? <button onclick="verFormulario('registro')">Crea tu perfil</button></p>
    </div>

    <div id="formRegistro" class="hide">
      <div class="campo"><label for="rgNombre">Tu nombre</label>
        <input id="rgNombre" placeholder="Como quieres salir en la tabla"></div>
      <div class="campo"><label for="rgWa">WhatsApp (número real, te va a llegar la verificación)</label>
        <div class="lada">
          <select id="rgPais"><option value="52">🇲🇽 +52</option><option value="1">🇺🇸 +1</option></select>
          <input id="rgWa" inputmode="tel" maxlength="14" placeholder="9181234567">
        </div></div>
      <div class="campo"><label for="rgPin">Crea un PIN de 4 dígitos</label>
        <input id="rgPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <div class="campo"><label>Escoge tu figura</label>
        <div class="avatares" id="rgAvatares"></div></div>
      <button class="btn" onclick="registrar()">Crear mi perfil</button>
      <div id="rgMsg"></div>
      <p class="cambio">¿Ya tienes perfil? <button onclick="verFormulario('login')">Entra aquí</button></p>
    </div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hide">
  <div class="barra">
    <div class="barra-in">
      <div class="escudo" id="miAvatar">⚽</div>
      <div>
        <h1>El Piji Achotero</h1>
        <small id="quienSoy">—</small>
      </div>
      <button class="salir" onclick="salir()">Salir</button>
    </div>
  </div>
  <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
  <main class="wrap" id="vista"><div class="cargando">Cargando…</div></main>
</div>

<datalist id="listaEquipos"></datalist>

<script>
/* ============================================================
   CONFIGURACIÓN — pon aquí tus llaves de Supabase
   ============================================================ */
const SUPABASE_URL  = "https://xuefkdynywuajknfluzh.supabase.co";
const SUPABASE_ANON = "sb_publishable_dF4SofCAvQ6VyDsuiFaSbw_rYcPiOx4";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const META_PARTIDOS = 10;
let WHATSAPP_ORG = '';
const AVATARES = ['⚽','🏆','🔥','🐓','🐂','🦅','🐐','🎯','👑','🥊','🐎','⭐','💥','🌵','🧢','🍺'];

/* ---------- Catálogo de equipos (Liga MX al Apertura 2026) ---------- */
const LIGAS = {
  'Liga MX': ['América','Atlante','Atlas','Atlético San Luis','Cruz Azul','Chivas','Juárez','León','Monterrey','Necaxa','Pachuca','Puebla','Pumas','Querétaro','Santos Laguna','Tigres','Tijuana','Toluca'],
  'Premier League': ['Arsenal','Aston Villa','Bournemouth','Brentford','Brighton','Chelsea','Crystal Palace','Everton','Fulham','Liverpool','Manchester City','Manchester United','Newcastle','Nottingham Forest','Tottenham','West Ham','Wolverhampton'],
  'LaLiga': ['Athletic Club','Atlético de Madrid','Barcelona','Betis','Celta de Vigo','Getafe','Girona','Mallorca','Osasuna','Rayo Vallecano','Real Madrid','Real Sociedad','Sevilla','Valencia','Villarreal'],
  'Serie A': ['Atalanta','Bologna','Fiorentina','Inter','Juventus','Lazio','Milan','Napoli','Roma','Torino'],
  'Bundesliga': ['Bayer Leverkusen','Bayern Múnich','Borussia Dortmund','Eintracht Frankfurt','Mönchengladbach','RB Leipzig','Stuttgart','Union Berlín','Werder Bremen','Wolfsburgo'],
  'Ligue 1': ['Lens','Lille','Lyon','Marsella','Mónaco','Niza','PSG','Rennes'],
  'Champions League': [],
  'Otra': []
};
LIGAS['Champions League'] = [...new Set([...LIGAS['Premier League'],...LIGAS['LaLiga'],...LIGAS['Serie A'],...LIGAS['Bundesliga'],...LIGAS['Ligue 1']])].sort();
const ORDEN_LIGAS = Object.keys(LIGAS);
const abrevia = l => ({'Liga MX':'MX','Premier League':'PREMIER','LaLiga':'LALIGA','Serie A':'SERIE A','Bundesliga':'BUNDES','Ligue 1':'LIGUE 1','Champions League':'CHAMPIONS'}[l] || (l||'OTRA').toUpperCase());

/* ---------- Estado ---------- */
let yo = null, tab = 'boleta';
let datos = { jornadas:[], jornada:null, partidos:[], boletos:[], pronosticos:[], usuarios:[] };
let borrador = {}, jornadaVista = null, cuenta = null, ligaSel = 'Liga MX';
let avatarNuevo = '⚽';
let porVerificar = null;   // usuario recién creado, esperando verificación
let historial = null;   // estadísticas del perfil

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guarda = (k,v)=>{ try{ localStorage.setItem(k,v) }catch(e){ window.__m=window.__m||{}; window.__m[k]=v } };
const lee    = k =>{ try{ return localStorage.getItem(k) }catch(e){ return (window.__m||{})[k] || null } };
const borra  = k =>{ try{ localStorage.removeItem(k) }catch(e){ if(window.__m) delete window.__m[k] } };
const dinero = n => '$' + Number(n||0).toFixed(2);
const fechaMX = d => new Date(d).toLocaleString('es-MX',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const soloD = s => String(s||'').replace(/\D/g,'');
const d10 = s => soloD(s).slice(-10);
const bonito = w => { const d = d10(w); return d.length===10 ? `${d.slice(0,3)} ${d.slice(3,6)} ${d.slice(6)}` : w; };
const nuevoCodigo = () => String(Math.floor(1000 + Math.random()*9000));

function aviso(el, texto, tipo='err'){ const e=$(el); if(e) e.innerHTML = texto ? `<div class="aviso ${tipo}">${esc(texto)}</div>` : ''; }

/* ============================================================
   ENTRADA Y REGISTRO
   ============================================================ */
function verFormulario(cual){
  $('formLogin').classList.toggle('hide', cual !== 'login');
  $('formRegistro').classList.toggle('hide', cual !== 'registro');
  if(cual === 'registro') pintarAvatares();
}

function pintarAvatares(){
  $('rgAvatares').innerHTML = AVATARES.map(a =>
    `<button type="button" class="av-op ${a===avatarNuevo?'sel':''}" onclick="elegirAvatar('${a}')">${a}</button>`).join('');
}
function elegirAvatar(a){ avatarNuevo = a; pintarAvatares(); }

async function registrar(){
  const nombre = $('rgNombre').value.trim();
  const pais   = $('rgPais').value;
  const num    = d10($('rgWa').value);
  const pin    = $('rgPin').value.trim();

  if(nombre.length < 3) return aviso('rgMsg','Escribe tu nombre completo.');
  if(num.length !== 10) return aviso('rgMsg','El número debe tener 10 dígitos, sin lada de país.');
  if(/^(\d)\1{9}$/.test(num)) return aviso('rgMsg','Ese número no es real. Pon tu WhatsApp de verdad.');
  if(pais === '52' && num[0] === '0') return aviso('rgMsg','Un número de México no empieza con 0.');
  if(pin.length !== 4)  return aviso('rgMsg','El PIN debe tener 4 dígitos.');

  const completo = pais + num;
  const { data:existe } = await sb.from('usuarios').select('id').ilike('whatsapp','%'+num).maybeSingle();
  if(existe) return aviso('rgMsg','Ese WhatsApp ya tiene perfil. Entra con tu PIN.');

  const codigo = nuevoCodigo();
  const { data, error } = await sb.from('usuarios').insert({
    nombre, whatsapp:completo, pais, pin, rol:'jugador',
    avatar:avatarNuevo, verificado:false, codigo_verif:codigo
  }).select().single();
  if(error) return aviso('rgMsg','No se pudo crear el perfil: ' + error.message);

  await traerConfig();
  porVerificar = data;
  pantallaVerificar();
}

function pantallaVerificar(){
  const u = porVerificar;
  const texto = `Soy ${u.nombre}. Mi código para las QUINIELAS EL PIJI ACHOTERO es ${u.codigo_verif}`;
  const link = WHATSAPP_ORG
    ? `https://wa.me/${WHATSAPP_ORG}?text=${encodeURIComponent(texto)}`
    : `https://wa.me/?text=${encodeURIComponent(texto)}`;

  $('entrada').innerHTML = `
  <div class="entrada-caja">
    <div class="logo-grande">
      <div class="balon">${u.avatar||'⚽'}</div>
      <h1>Verifica tu<br>WhatsApp</h1>
      <p>${bonito(u.whatsapp)}</p>
    </div>
    <div class="tarjeta ver-caja">
      <span style="font-size:13px;color:var(--cal-suave)">Tu código</span>
      <div class="cod">${u.codigo_verif}</div>
      <p style="font-size:14px;color:var(--cal-suave)">Mándalo por WhatsApp al organizador desde este mismo teléfono. En cuanto lo apruebe, tu perfil queda activo.</p>
      <button class="btn" onclick="window.open('${link}','_blank')">Mandar código por WhatsApp</button>
      <button class="btn fantasma" onclick="location.reload()">Ya lo mandé, entrar</button>
    </div>
    <p class="cambio">Tu perfil ya quedó guardado. Puedes entrar con tu número y PIN, pero no cuenta tu boleta hasta que te verifiquen.</p>
  </div>`;
}

async function entrar(){
  const wa  = $('lgWa').value.trim(), pin = $('lgPin').value.trim();
  if(!wa || !pin) return aviso('lgMsg','Faltan tus datos.');
  let data = null;
  if(/\d/.test(wa)){
    const r = await sb.from('usuarios').select('*').ilike('whatsapp','%'+d10(wa));
    data = (r.data || [])[0] || null;
  } else {
    const r = await sb.from('usuarios').select('*').eq('whatsapp', wa.toUpperCase()).maybeSingle();
    data = r.data;
  }
  if(!data)            return aviso('lgMsg','No encontramos ese perfil.');
  if(data.pin !== pin) return aviso('lgMsg','PIN incorrecto.');
  if(!data.activo)     return aviso('lgMsg','Tu perfil está suspendido. Habla con el organizador.');
  iniciarSesion(data);
}

function iniciarSesion(u){
  yo = u;
  guarda('piji_uid', u.id);
  $('entrada').classList.add('hide');
  $('app').classList.remove('hide');
  $('miAvatar').textContent = u.avatar || '⚽';
  const et = u.rol === 'admin' ? 'Dueño · ' : (u.rol === 'organizador' ? 'Organizador · ' : '');
  $('quienSoy').textContent = et + u.nombre;
  armarTabs(); cargar(); suscribir();
}

function salir(){ borra('piji_uid'); location.reload(); }

async function sesionGuardada(){
  const id = lee('piji_uid');
  if(!id) return;
  const { data } = await sb.from('usuarios').select('*').eq('id', id).maybeSingle();
  if(data && data.activo) iniciarSesion(data); else borra('piji_uid');
}

/* ============================================================
   CARGA
   ============================================================ */
async function traerConfig(){
  const { data } = await sb.from('config').select('*').eq('clave','whatsapp_org').maybeSingle();
  WHATSAPP_ORG = data?.valor || '';
}

async function cargar(){
  await traerConfig();
  const { data:jornadas } = await sb.from('jornadas').select('*').order('created_at',{ascending:false});
  datos.jornadas = jornadas || [];
  if(!jornadaVista || !datos.jornadas.some(j => j.id === jornadaVista)){
    const abierta = datos.jornadas.find(j => j.estado === 'abierta');
    jornadaVista = (abierta || datos.jornadas[0])?.id || null;
  }
  datos.jornada = datos.jornadas.find(j => j.id === jornadaVista) || null;

  const { data:us } = await sb.from('usuarios').select('id,nombre,whatsapp,rol,activo,avatar,verificado,codigo_verif');
  datos.usuarios = us || [];

  if(datos.jornada){
    const [p, b] = await Promise.all([
      sb.from('partidos').select('*').eq('jornada_id', jornadaVista).order('orden'),
      sb.from('boletos').select('*').eq('jornada_id', jornadaVista).order('created_at')
    ]);
    datos.partidos = p.data || [];
    datos.boletos  = b.data || [];
    const ids = datos.boletos.map(x => x.id);
    datos.pronosticos = ids.length ? ((await sb.from('pronosticos').select('*').in('boleto_id', ids)).data || []) : [];
    const mio = miBoleto();
    borrador = {};
    if(mio) datos.pronosticos.filter(x => x.boleto_id === mio.id).forEach(x => borrador[x.partido_id] = x.pick);
  } else { datos.partidos = []; datos.boletos = []; datos.pronosticos = []; }
  pintar();
}

function suscribir(){
  sb.channel('piji').on('postgres_changes',{event:'*',schema:'public'}, () => { historial = null; cargar(); }).subscribe();
}

/* ---------- Cálculos ---------- */
const miBoleto = () => datos.boletos.find(b => b.usuario_id === yo?.id);
const usuarioDe = id => datos.usuarios.find(u => u.id === id) || {};
const nombreDe = id => usuarioDe(id).nombre || 'Jugador';
const avatarDe = id => usuarioDe(id).avatar || '⚽';
const waDe     = id => usuarioDe(id).whatsapp || '';
const verifDe  = id => !!usuarioDe(id).verificado;
const esDueno  = () => yo?.rol === 'admin';
const esStaff  = () => ['admin','organizador'].includes(yo?.rol);
const esJugador= u => !['admin','organizador'].includes(u.rol);
const tituloRol= r => r === 'admin' ? 'Dueño' : (r === 'organizador' ? 'Organizador' : '');

function puntosDe(boletoId){
  let pts = 0;
  datos.pronosticos.filter(p => p.boleto_id === boletoId).forEach(p => {
    const par = datos.partidos.find(m => m.id === p.partido_id);
    if(par && par.resultado && par.resultado === p.pick) pts++;
  });
  return pts;
}

function bolsa(){
  const j = datos.jornada; if(!j) return 0;
  return datos.boletos.filter(b => b.pagado).length * Number(j.costo);
}

/* Gana el que más aciertos tenga. Empate en aciertos = mismo lugar y premio dividido. */
function tablaPosiciones(){
  const j = datos.jornada;
  const lista = datos.boletos.map(b => ({ ...b, nombre:nombreDe(b.usuario_id), avatar:avatarDe(b.usuario_id), verif:verifDe(b.usuario_id), puntos:puntosDe(b.id) }))
    .sort((a,b) => b.puntos - a.puntos || new Date(a.created_at) - new Date(b.created_at));
  const total = bolsa(), pcts = [j?.pct1||0, j?.pct2||0, j?.pct3||0];
  let lugar = 0, prev = null, i = 0;
  lista.forEach(f => { i++; if(f.puntos !== prev){ lugar = i; prev = f.puntos; } f.lugar = lugar; });
  lista.forEach(f => {
    const emp = lista.filter(x => x.lugar === f.lugar).length;
    const pct = pcts[f.lugar - 1] || 0;
    f.premio = (j?.estado === 'finalizada' && pct) ? (total * pct / 100) / emp : 0;
  });
  return lista;
}

function porLiga(lista){
  const g = [];
  lista.forEach(p => {
    const l = p.liga || 'Otra';
    let b = g.find(x => x.liga === l);
    if(!b){ b = { liga:l, partidos:[] }; g.push(b); }
    b.partidos.push(p);
  });
  g.sort((a,b) => ORDEN_LIGAS.indexOf(a.liga) - ORDEN_LIGAS.indexOf(b.liga));
  return g;
}

/* ============================================================
   PINTADO
   ============================================================ */
function armarTabs(){
  const t = [['boleta','Boleta'],['tabla','Tabla'],['perfil','Perfil']];
  if(esStaff()) t.push(['admin','Organizar']);
  $('tabs').innerHTML = t.map(([k,n]) => `<button class="tab ${tab===k?'on':''}" onclick="irA('${k}')">${n}</button>`).join('');
}
function irA(k){ tab = k; armarTabs(); pintar(); if(k === 'perfil' && !historial) cargarHistorial(); }

function pintar(){
  if(cuenta) clearInterval(cuenta);
  const v = $('vista');
  if(tab === 'boleta') v.innerHTML = vistaBoleta();
  if(tab === 'tabla')  v.innerHTML = vistaTabla();
  if(tab === 'perfil') v.innerHTML = vistaPerfil();
  if(tab === 'admin'){ v.innerHTML = vistaAdmin(); refrescarEquipos(); }
  arrancarReloj();
}

function arrancarReloj(){
  const el = document.querySelector('[data-reloj]');
  if(!el) return;
  const limite = new Date(el.dataset.reloj).getTime();
  const tick = () => {
    const falta = limite - Date.now();
    if(falta <= 0){ el.innerHTML = '<span class="num">CERRADA</span>'; clearInterval(cuenta); return; }
    const d=Math.floor(falta/86400000), h=Math.floor(falta/3600000)%24, m=Math.floor(falta/60000)%60, s=Math.floor(falta/1000)%60;
    el.innerHTML = (d?`<span class="num">${d}</span><span class="etq">d</span>`:'')
      + `<span class="num">${String(h).padStart(2,'0')}</span><span class="etq">h</span>`
      + `<span class="num">${String(m).padStart(2,'0')}</span><span class="etq">m</span>`
      + `<span class="num">${String(s).padStart(2,'0')}</span><span class="etq">s</span>`
      + `<span class="etq">para cerrar</span>`;
  };
  tick(); cuenta = setInterval(tick, 1000);
}

function cabecera(){
  const j = datos.jornada;
  const pagados = datos.boletos.filter(b => b.pagado).length;
  const mx = datos.partidos.filter(p => p.liga === 'Liga MX').length;
  const eu = datos.partidos.length - mx;
  return `
  <div class="marcador">
    <div class="marcador-top">
      <h2>${esc(j.nombre)}</h2>
      <p>${datos.partidos.length} partidos${mx?` · ${mx} de Liga MX`:''}${eu?` · ${eu} de Europa`:''} · ${dinero(j.costo)} ${esc(j.moneda)} la boleta</p>
    </div>
    ${j.estado === 'abierta'
      ? `<div class="reloj" data-reloj="${j.fecha_limite}"></div>`
      : `<div class="reloj"><span class="num">${j.estado === 'cerrada' ? 'EN JUEGO' : 'FINALIZADA'}</span></div>`}
    <div class="bolsa">
      <span>Bolsa acumulada<br>${datos.boletos.length} boletas · ${pagados} pagadas</span>
      <b>${dinero(bolsa())}</b>
    </div>
  </div>`;
}

/* ---------- BOLETA ---------- */
function vistaBoleta(){
  const j = datos.jornada;
  if(!j) return `<div class="vacio">Todavía no hay ninguna quiniela abierta.<br>Espera a que el organizador publique la próxima jornada.</div>`;
  if(!datos.partidos.length) return cabecera() + `<div class="vacio">Esta jornada aún no tiene partidos cargados.</div>`;

  const mio = miBoleto();
  const editable = j.estado === 'abierta' && new Date(j.fecha_limite) > new Date();
  const jugados = datos.partidos.filter(p => p.resultado).length;
  const puntos = mio ? puntosDe(mio.id) : 0;

  const cuerpo = porLiga(datos.partidos).map(g => `
    <div class="grupo">${esc(abrevia(g.liga))}</div>
    ${g.partidos.map(p => {
      const sel = borrador[p.id];
      const btn = v => {
        let cls = 'pick';
        if(sel === v) cls += ' sel';
        if(p.resultado && sel === v) cls += p.resultado === v ? ' acierto' : ' fallo';
        return `<button class="${cls}" ${editable?'':'disabled'} onclick="marcar('${p.id}','${v}')">${v}</button>`;
      };
      const nres = {L:'Ganó local', E:'Empate', V:'Ganó visita'}[p.resultado];
      return `
      <div class="filap">
        <div class="equipos">
          <div class="l"><span class="num-p">${p.orden}</span>${esc(p.local)}</div>
          <div class="vs">VS</div>
          <div class="v">${esc(p.visita)}</div>
          ${p.hora ? `<div class="hr">${esc(p.hora)}</div>` : ''}
          ${p.resultado ? `<div class="res-chip">${nres}</div>` : ''}
        </div>
        <div class="picks">${btn('L')}${btn('E')}${btn('V')}</div>
      </div>`;
    }).join('')}`).join('');

  let pie = '';
  if(editable){
    const faltan = datos.partidos.length - Object.keys(borrador).length;
    pie = `
      <button class="btn" onclick="guardarBoleta()" ${faltan?'disabled':''}>
        ${faltan ? `Te faltan ${faltan} partidos` : (mio ? 'Actualizar mi boleta' : 'Guardar mi boleta')}
      </button>
      <div id="bolMsg"></div>
      ${!yo.verificado ? bannerVerificar() : ''}
      ${mio && !mio.pagado ? `<div class="aviso info">Tu boleta está registrada pero aún no aparece como pagada. Manda tus ${dinero(j.costo)} al organizador para entrar al reparto.</div>` : ''}
      <p class="mini">Gana el que más aciertos junte. Puedes cambiar tus pronósticos hasta que cierre el reloj.</p>`;
  } else if(mio){
    pie = `<div class="aviso ${jugados?'ok':'info'}">Llevas ${puntos} ${puntos===1?'acierto':'aciertos'} de ${jugados} ${jugados===1?'partido jugado':'partidos jugados'}.</div>`;
  } else {
    pie = `<div class="aviso err">El registro ya cerró y no alcanzaste a mandar boleta esta jornada.</div>`;
  }

  return cabecera() + `
    <div class="boleta">
      <div class="boleta-cab"><h3>${mio?'Mi boleta':'Llena tu boleta'}</h3><em>L · empate · V</em></div>
      ${cuerpo}
    </div>${pie}`;
}

function bannerVerificar(){
  const texto = `Soy ${yo.nombre}. Mi código para las QUINIELAS EL PIJI ACHOTERO es ${yo.codigo_verif||''}`;
  const link = WHATSAPP_ORG ? `https://wa.me/${WHATSAPP_ORG}?text=${encodeURIComponent(texto)}`
                            : `https://wa.me/?text=${encodeURIComponent(texto)}`;
  return `<div class="aviso err">
    Tu WhatsApp todavía no está verificado, así que tu boleta no cuenta.
    Manda tu código <b>${esc(yo.codigo_verif||'')}</b> al organizador.
    <button class="btn chico" style="margin-top:10px" onclick="window.open('${link}','_blank')">Mandar mi código</button>
  </div>`;
}

function marcar(id, v){ borrador[id] = v; pintar(); }

async function guardarBoleta(){
  const j = datos.jornada;
  if(new Date(j.fecha_limite) <= new Date()){ await cargar(); return aviso('bolMsg','El registro acaba de cerrar.'); }
  let boleto = miBoleto();
  if(!boleto){
    const { data, error } = await sb.from('boletos').insert({ jornada_id:j.id, usuario_id:yo.id, alias:yo.nombre }).select().single();
    if(error) return aviso('bolMsg','No se pudo guardar: ' + error.message);
    boleto = data;
  }
  const filas = Object.entries(borrador).map(([partido_id, pick]) => ({ boleto_id:boleto.id, partido_id, pick }));
  const { error } = await sb.from('pronosticos').upsert(filas, { onConflict:'boleto_id,partido_id' });
  if(error) return aviso('bolMsg','No se pudieron guardar los pronósticos: ' + error.message);
  historial = null;
  await cargar();
  aviso('bolMsg','Boleta guardada. Mucha suerte.','ok');
}

/* ---------- TABLA ---------- */
function vistaTabla(){
  const j = datos.jornada;
  if(!j) return `<div class="vacio">No hay jornada que mostrar.</div>`;
  const lista = tablaPosiciones();
  if(!lista.length) return cabecera() + `<div class="vacio">Nadie ha mandado boleta todavía. Sé el primero.</div>`;
  const jugados = datos.partidos.filter(p => p.resultado).length;
  const filas = lista.map(f => `
    <div class="pos ${f.lugar===1?'p1':''}">
      <div class="lug">${f.lugar}</div>
      <div class="av">${f.avatar}</div>
      <div class="nom">${esc(f.nombre)}${f.usuario_id===yo.id?' · tú':''}${!f.verif?'<small class="deuda">Sin verificar</small>':(!f.pagado?'<small class="deuda">Sin pagar</small>':'')}</div>
      <div class="pts">${f.puntos}</div>
      <div class="prem">${f.premio?dinero(f.premio):''}</div>
    </div>`).join('');
  return cabecera() + `
    <div class="tabla">
      <div class="tabla-cab">Posiciones · ${jugados} de ${datos.partidos.length} partidos jugados</div>
      ${filas}
    </div>

async function cargarHistorial(){
  const ids = datos.jornadas.map(j => j.id);
  if(!ids.length){ historial = { jornadas:[], jugadas:0, aciertos:0, ganadas:0, premio:0 }; return pintar(); }

  const [bt, pt] = await Promise.all([
    sb.from('boletos').select('*').in('jornada_id', ids),
    sb.from('partidos').select('id,jornada_id,resultado').in('jornada_id', ids)
  ]);
  const boletos = bt.data || [], partidos = pt.data || [];
  const pr = boletos.length ? ((await sb.from('pronosticos').select('*').in('boleto_id', boletos.map(b=>b.id))).data || []) : [];

  const resumen = [];
  datos.jornadas.forEach(j => {
    const bs = boletos.filter(b => b.jornada_id === j.id);
    const ps = partidos.filter(p => p.jornada_id === j.id);
    const conRes = ps.filter(p => p.resultado).length;
    const marcados = bs.map(b => {
      let a = 0;
      pr.filter(x => x.boleto_id === b.id).forEach(x => {
        const par = ps.find(m => m.id === x.partido_id);
        if(par && par.resultado === x.pick) a++;
      });
      return { ...b, aciertos:a };
    }).sort((x,y) => y.aciertos - x.aciertos || new Date(x.created_at) - new Date(y.created_at));

    const mio = marcados.find(b => b.usuario_id === yo.id);
    if(!mio) return;
    const mejor = marcados[0]?.aciertos ?? 0;
    const empatados = marcados.filter(b => b.aciertos === mejor).length;
    const pagadas = marcados.filter(b => b.pagado).length;
    const gane = j.estado === 'finalizada' && mio.aciertos === mejor && conRes > 0;
    resumen.push({
      jornada:j, aciertos:mio.aciertos, jugados:conRes, total:ps.length,
      pagado:mio.pagado, gane,
      premio: gane ? (pagadas * Number(j.costo) * (j.pct1/100)) / empatados : 0
    });
  });

  historial = {
    jornadas: resumen,
    jugadas: resumen.length,
    aciertos: resumen.reduce((s,r) => s + r.aciertos, 0),
    ganadas: resumen.filter(r => r.gane).length,
    premio: resumen.reduce((s,r) => s + r.premio, 0)
  };
  pintar();
}

    pct1:Number($('njP1').value)||0, pct2:Number($('njP2').value)||0, pct3:Number($('njP3').value)||0

async function agregarPartido(){
  const local = $('apLocal').value.trim(), visita = $('apVisita').value.trim();
  if(!local || !visita) return aviso('apMsg','Faltan los dos equipos.');
  if(local.toLowerCase() === visita.toLowerCase()) return aviso('apMsg','Un equipo no juega contra sí mismo.');
  const { error } = await sb.from('partidos').insert({
    jornada_id: datos.jornada.id, orden: datos.partidos.length + 1,
    liga: ligaSel, local, visita, hora: $('apHora').value.trim() || null
  });
  if(error) return aviso('apMsg','No se pudo agregar: ' + error.message);
  $('apLocal').value = ''; $('apVisita').value = '';
  await cargar();
  $('apLocal')?.focus();
}

async function quitarPartido(id){
  if(!confirm('¿Eliminar este partido? También se borran los pronósticos de ese partido.')) return;
  await sb.from('partidos').delete().eq('id', id);
  const restantes = datos.partidos.filter(p => p.id !== id);
  for(let i = 0; i < restantes.length; i++){
    if(restantes[i].orden !== i+1) await sb.from('partidos').update({ orden:i+1 }).eq('id', restantes[i].id);
  }
  await cargar();
}

async function ponerResultado(id, v){
  const actual = datos.partidos.find(p => p.id === id)?.resultado;
  await sb.from('partidos').update({ resultado: actual === v ? null : v }).eq('id', id);
  historial = null;
  await cargar();
}

  if(estado === 'finalizada' && !confirm('¿Finalizar la jornada? Se calculan los premios con los resultados actuales.')) return;
  await sb.from('jornadas').update({ estado }).eq('id', datos.jornada.id);
  historial = null;
  await cargar();
}

async function alternarJugador(id, activo){
  await sb.from('usuarios').update({ activo: !activo }).eq('id', id);
  await cargar();
}

function convocar(){
  const j = datos.jornada;
  let t = `*QUINIELAS EL PIJI ACHOTERO*\n${j.nombre}\n\n`;
  t += `Costo: ${dinero(j.costo)} ${j.moneda}\nCierra: ${fechaMX(j.fecha_limite)}\nBolsa actual: ${dinero(bolsa())}\nGana el que más aciertos junte.\n\n`;
  porLiga(datos.partidos).forEach(g => {
    t += `_${abrevia(g.liga)}_\n`;
    g.partidos.forEach(p => t += `${p.orden}. ${p.local} vs ${p.visita}${p.hora?' · '+p.hora:''}\n`);
    t += `\n`;
  });
  t += `Crea tu perfil y llena tu boleta: ${location.origin}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

/* ---------- Arranque ---------- */
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(!$('entrada').classList.contains('hide')){
    $('formLogin').classList.contains('hide') ? registrar() : entrar();
  } else if(['apVisita','apHora'].includes(document.activeElement?.id)){
    agregarPartido();
  }
});
pintarAvatares();
sesionGuardada();
</script>
